<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#79c8f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Little Pilot</title>
<style>
  :root { --veh: #e0483e; --veh2: #f2f4f7; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79c8f2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas#gl {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .pillar {
    position: absolute;
    top: -4vh;
    width: clamp(34px, 7vw, 92px);
    height: 62vh;
    background: linear-gradient(105deg, #2b3038 0%, #23282f 55%, #1a1e24 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.45);
  }
  #pillarL {
    left: calc(-2vw + env(safe-area-inset-left));
    transform: skewX(7deg);
    border-radius: 0 14px 26px 0;
  }
  #pillarR {
    right: calc(-2vw + env(safe-area-inset-right));
    transform: skewX(-7deg);
    border-radius: 0 0 14px 26px;
    transform: skewX(-7deg);
  }
  #brow {
    position: absolute;
    top: calc(-2vh + env(safe-area-inset-top));
    left: -2vw;
    right: -2vw;
    height: clamp(30px, 6.5vh, 74px);
    background: linear-gradient(180deg, #2b3038 0%, #23282f 70%, #1a1e24 100%);
    border-radius: 0 0 22px 22px;
    box-shadow: 0 6px 16px rgba(10,20,40,.35);
  }
  #accentLine {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 0 0 22px 22px;
  }
  #dash {
    position: absolute;
    left: -2vw;
    right: -2vw;
    bottom: calc(-2vh + env(safe-area-inset-bottom));
    height: clamp(96px, 19vh, 170px);
    background: linear-gradient(180deg, #333a44 0%, #23282f 18%, #1a1e24 100%);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 24px rgba(10,20,40,.35);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(18px, 5vw, 64px);
    padding-top: clamp(10px, 2.2vh, 24px);
  }
  #dash::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 26px 26px 0 0;
  }
  .dial {
    position: relative;
    width: clamp(76px, 15vmin, 128px);
    height: clamp(76px, 15vmin, 128px);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #2c323b 0%, #161a1f 62%);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.08);
    border: clamp(3px, 0.8vmin, 6px) solid #39404b;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(2.5px, 0.7vmin, 4.5px);
    height: 42%;
    background: #f2f4f7;
    border-radius: 3px;
    transform-origin: 50% 100%;
    translate: -50% -100%;
    will-change: transform;
  }
  .needle.red { background: #e0483e; height: 36%; width: clamp(3.5px, 1vmin, 6px); }
  .dial-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16%;
    height: 16%;
    background: #39404b;
    border-radius: 50%;
    translate: -50% -50%;
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(1.5px, 0.4vmin, 3px);
    height: 11%;
    background: #8b93a0;
    transform-origin: 50% 0;
  }
  #aiBall {
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(180deg, #79c8f2 0%, #a8dcf7 46%, #f4f8fa 48%, #f4f8fa 50%, #8a6f47 52%, #6f5738 100%);
    will-change: transform;
  }
  #aiHorizon {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: clamp(2px, 0.55vmin, 4px);
    background: #ffffff;
    opacity: .9;
  }
  #aiWings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58%;
    height: clamp(4px, 1.1vmin, 8px);
    translate: -50% -50%;
    z-index: 3;
  }
  #aiWings::before, #aiWings::after {
    content: "";
    position: absolute;
    top: 0;
    width: 44%;
    height: clamp(3px, 0.8vmin, 5px);
    background: #ffb43a;
    border-radius: 3px;
  }
  #aiWings::before { left: 0; }
  #aiWings::after { right: 0; }
  #aiWings span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(6px, 1.6vmin, 10px);
    height: clamp(6px, 1.6vmin, 10px);
    translate: -50% -50%;
    background: #ffb43a;
    border-radius: 50%;
  }
  #altDigits {
    position: absolute;
    left: 50%;
    bottom: 9%;
    translate: -50% 0;
    color: #e8ecf2;
    font-size: clamp(13px, 3.4vmin, 24px);
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  #rotateArrow {
    position: fixed;
    top: max(11vh, env(safe-area-inset-top) + 44px);
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #rotateArrow svg { width: clamp(72px, 14vmin, 130px); height: auto; display: block; }
  @keyframes blinkArrow {
    0%, 49% { opacity: 1; transform: translateY(0); }
    50%, 100% { opacity: 0.12; transform: translateY(10px); }
  }
  #rotateArrow.on { display: block; animation: blinkArrow .55s infinite; }
  #homeArrow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 7;
    pointer-events: none;
  }
  #homeArrow svg {
    display: none;
    width: var(--home-sz, 96px);
    height: var(--home-sz, 96px);
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.5));
  }
  #homeArrow.on svg {
    display: block;
    animation: homePulse 1.5s ease-in-out infinite;
  }
  @keyframes homePulse {
    0%, 100% { opacity: .82; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  #throttleBtn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    width: clamp(96px, 17vmin, 148px);
    height: clamp(96px, 17vmin, 148px);
    border-radius: 50%;
    border: clamp(4px, 1vmin, 7px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 10px 26px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    z-index: 10;
    touch-action: none;
    padding: 0;
    outline: none;
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #throttleBtn svg { width: 52%; height: 52%; }
  #throttleBtn.pressed {
    transform: scale(.93);
    box-shadow: 0 4px 12px rgba(10,20,40,.4), inset 0 3px 10px rgba(0,0,0,.5);
  }
  #throttleBtn.hidden { display: none; }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }
  .roundBtn {
    position: fixed;
    width: clamp(84px, 14vmin, 120px);
    height: clamp(84px, 14vmin, 120px);
    border-radius: 50%;
    border: clamp(3px, 0.8vmin, 6px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 8px 20px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    touch-action: none;
    padding: 0;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .08s ease, opacity .25s ease, visibility .25s;
  }
  .roundBtn svg { width: 54%; height: 54%; pointer-events: none; }
  .roundBtn:active { transform: scale(.93); }
  .roundBtn.off { opacity: .55; }
  #viewBtn {
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 46px);
    right: calc(22px + env(safe-area-inset-right));
    z-index: 11;
  }
  #gearBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    left: calc(22px + env(safe-area-inset-left));
    z-index: 10;
  }
  #gearBtn.hidden { display: none; }
  #gearBtn .icoUp { display: none; }
  #gearBtn.gear-up .icoDown { display: none; }
  #gearBtn.gear-up .icoUp { display: block; }
  #hud.chase #pillarL, #hud.chase #pillarR, #hud.chase #brow { display: none; }
  #glideGuide {
    position: fixed;
    top: 30%;
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #glideGuide.on { display: block; }
  #glideGuide svg { width: clamp(64px, 12vmin, 108px); height: auto; display: none; }
  #glideGuide[data-state="up"] .gUp { display: block; }
  #glideGuide[data-state="down"] .gDown { display: block; }
  #glideGuide[data-state="ok"] .gOk { display: block; animation: guidePulse 0.9s ease-in-out infinite; }
  @keyframes guidePulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.12); }
  }
  #slowBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    right: calc(22px + env(safe-area-inset-right));
    z-index: 10;
  }
  #slowBtn.hidden { display: none; }
  #slowBtn.pressed { transform: scale(.93); }
  .screen {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 30%, rgba(36,44,56,.97), rgba(14,17,22,.98));
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: clamp(16px, 3vmin, 34px);
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-y: auto;
  }
  .screen.hiddenS { display: none; }
  .card {
    width: clamp(150px, 23vmin, 225px);
    height: clamp(110px, 16vmin, 158px);
    border-radius: 22px;
    background: linear-gradient(165deg, #2e3540 0%, #191d23 100%);
    border: clamp(4px, 0.9vmin, 7px) solid #39404b;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none; touch-action: manipulation;
    transition: transform .08s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .card:active { transform: scale(.94); }
  .card.sel { border-color: var(--veh); }
  .card svg { width: 84%; height: 84%; }
  .dirCard {
    width: clamp(180px, 30vmin, 270px);
    height: clamp(140px, 23vmin, 215px);
  }
  #progressStrip {
    position: fixed;
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 12px);
    left: 50%;
    translate: -50% 0;
    width: min(46vw, 430px);
    height: 26px;
    z-index: 6;
    pointer-events: none;
  }
  #progressStrip .rail {
    position: absolute;
    top: 12px; left: 0; right: 0;
    height: 3.5px;
    background: rgba(20,26,34,.6);
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  #progressStrip .dot {
    position: absolute;
    top: 9.5px;
    width: 9px; height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: #39404b;
    border: 2px solid rgba(240,244,248,.8);
    transition: background .3s;
  }
  #progressStrip .dot.passed { background: var(--veh); }
  #progressStrip .marker {
    position: absolute;
    top: -3px;
    width: 22px; height: 22px;
    margin-left: -11px;
    will-change: transform;
  }
</style>
</head>
<body>
<div id="hud">
  <div id="pillarL" class="pillar"></div>
  <div id="pillarR" class="pillar"></div>
  <div id="brow"><div id="accentLine"></div></div>
  <div id="dash">
    <div class="dial" id="asiDial"></div>
    <div class="dial" id="aiDial">
      <div id="aiBall"><div id="aiHorizon"></div></div>
      <div id="aiWings"><span></span></div>
    </div>
    <div class="dial" id="altDial"><div id="altDigits">0</div></div>
  </div>
</div>
<div id="rotateArrow">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 8 L88 66 L66 66 L66 94 L34 94 L34 66 L12 66 Z" fill="#ffd23e" stroke="#c9971d" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</div>
<button id="viewBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path d="M50 22 a28 28 0 1 0 28 28" fill="none" stroke="#f2f4f7" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 34 L82 52 L64 46 Z" fill="#f2f4f7" stroke="#f2f4f7" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</button>
<button id="slowBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path d="M28 44 L50 70 L72 44" fill="none" stroke="#f2f4f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 72 L50 94 L72 72" fill="none" stroke="#e0483e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
  </svg>
</button>
<button id="gearBtn" class="roundBtn" aria-hidden="true">
  <svg class="icoDown" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="34" stroke="#f2f4f7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="56" r="18" fill="#f2f4f7"/>
    <line x1="16" y1="90" x2="84" y2="90" stroke="#f2f4f7" stroke-width="8" stroke-linecap="round"/>
  </svg>
  <svg class="icoUp" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="34" stroke="#8b93a0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="56" r="18" fill="none" stroke="#8b93a0" stroke-width="9"/>
    <line x1="18" y1="20" x2="82" y2="86" stroke="#e0483e" stroke-width="11" stroke-linecap="round"/>
  </svg>
</button>
<div id="glideGuide">
  <svg class="gUp" viewBox="0 0 100 100">
    <path d="M50 14 L86 74 L62 62 L62 90 L38 90 L38 62 L14 74 Z" fill="#ffd23e" stroke="#8a6a10" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <svg class="gDown" viewBox="0 0 100 100">
    <path d="M50 90 L14 30 L38 42 L38 14 L62 14 L62 42 L86 30 Z" fill="#ffd23e" stroke="#8a6a10" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <svg class="gOk" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#3fdc6a" stroke-width="10"/>
    <circle cx="50" cy="50" r="14" fill="#3fdc6a"/>
  </svg>
</div>
<div id="progressStrip"><div class="rail"></div></div>
<div id="homeArrow">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 6 L90 74 L64 62 L58 93 L42 93 L36 62 L10 74 Z" fill="#f2f4f7" stroke="#23282f" stroke-width="7" stroke-linejoin="round"/>
  </svg>
</div>
<button id="throttleBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 56 L50 30 L72 56" fill="none" stroke="#f2f4f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 84 L50 58 L72 84" fill="none" stroke="#e0483e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<canvas id="fx"></canvas>
<div id="screenVehicle" class="screen">
  <button class="card vehCard" data-v="prop">
    <svg viewBox="0 0 200 120">
      <path d="M30 78 L48 44 L92 44 L92 30 L104 30 L104 44 L150 44 Q176 46 178 60 Q176 74 150 76 L48 76 Z" fill="#ef4b3f" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <rect x="88" y="20" width="10" height="26" rx="4" fill="#ffe9c9" stroke="#23282f" stroke-width="4"/>
      <ellipse cx="93" cy="82" rx="34" ry="7" fill="#ffe9c9" stroke="#23282f" stroke-width="4"/>
      <line x1="178" y1="60" x2="192" y2="60" stroke="#23282f" stroke-width="6" stroke-linecap="round"/>
      <circle cx="146" cy="58" r="9" fill="#bfeaff" stroke="#23282f" stroke-width="4"/>
    </svg>
  </button>
  <button class="card vehCard hiddenS" data-v="helicopter">
    <svg viewBox="0 0 200 120">
      <line x1="20" y1="22" x2="180" y2="22" stroke="#23282f" stroke-width="7" stroke-linecap="round"/>
      <rect x="95" y="18" width="10" height="16" fill="#23282f"/>
      <path d="M60 60 Q60 38 95 38 Q128 38 132 58 L132 74 Q132 86 112 88 L78 88 Q60 84 60 60 Z" fill="#20a39e" stroke="#23282f" stroke-width="5"/>
      <rect x="126" y="54" width="54" height="9" rx="4" fill="#20a39e" stroke="#23282f" stroke-width="4"/>
      <path d="M172 40 L184 40 L178 62 Z" fill="#20a39e" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="88" cy="58" r="11" fill="#bfeaff" stroke="#23282f" stroke-width="4"/>
      <line x1="70" y1="98" x2="118" y2="98" stroke="#23282f" stroke-width="6" stroke-linecap="round"/>
      <line x1="82" y1="88" x2="80" y2="98" stroke="#23282f" stroke-width="5"/>
      <line x1="108" y1="88" x2="110" y2="98" stroke="#23282f" stroke-width="5"/>
    </svg>
  </button>
  <button class="card vehCard hiddenS" data-v="rocket">
    <svg viewBox="0 0 200 120">
      <path d="M100 6 Q122 34 122 62 L122 96 L78 96 L78 62 Q78 34 100 6 Z" fill="#b8bec9" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M78 70 L54 100 L78 96 Z" fill="#d71920" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M122 70 L146 100 L122 96 Z" fill="#d71920" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="100" cy="46" r="11" fill="#bfeaff" stroke="#23282f" stroke-width="5"/>
      <path d="M88 96 Q100 118 112 96 Z" fill="#ffb43a" stroke="#c96a10" stroke-width="4"/>
    </svg>
  </button>
  <button class="card vehCard" data-v="airlinerDelta">
    <svg viewBox="0 0 200 120">
      <path d="M22 66 Q60 56 108 56 L138 58 Q162 62 164 70 L138 76 L60 78 Q34 76 22 66 Z" fill="#0b4ea2" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M64 58 L96 20 L116 20 L92 58 Z" fill="#0b4ea2" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M96 20 L116 20 L110 34 L94 34 Z" fill="#d0342c" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M70 76 L104 96 L124 96 L96 74 Z" fill="#dfe8f2" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 58 L96 44 L112 46 L82 58 Z" fill="#dfe8f2" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="card vehCard" data-v="airlinerJetblue">
    <svg viewBox="0 0 200 120">
      <path d="M22 66 Q60 56 108 56 L138 58 Q162 62 164 70 L138 76 L60 78 Q34 76 22 66 Z" fill="#e8edf4" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M64 58 L96 20 L116 20 L92 58 Z" fill="#1c75bc" stroke="#23282f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M96 20 L116 20 L110 34 L94 34 Z" fill="#1c75bc" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M70 76 L104 96 L124 96 L96 74 Z" fill="#1c75bc" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 58 L96 44 L112 46 L82 58 Z" fill="#9cc4e4" stroke="#23282f" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="card vehCard" data-v="airlinerEmirates">
    <svg viewBox="0 0 200 120">

const DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function wrapPi(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function hash2(ix, iz) {
  let n = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = (n ^ (n >>> 16)) >>> 0;
  return n / 4294967295;
}

function hashSalt(ix, iz, salt) {
  return hash2(ix + salt * 7919, iz - salt * 104729);
}

let seed = 987654321;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz);
  const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

function rawHeight(x, z) {
  return valueNoise(x / TUNE.hillWavelength, z / TUNE.hillWavelength) * TUNE.hillAmplitude
       + valueNoise(x / TUNE.midWavelength + 37.2, z / TUNE.midWavelength + 91.7) * TUNE.midAmplitude
       + valueNoise(x / TUNE.microWavelength + 512.1, z / TUNE.microWavelength + 77.3) * TUNE.microAmplitude
       - TUNE.hillAmplitude * 0.5;
}

const ROUTE_HALF = () => TUNE.routeLength / 2;
const ROUTE_SCALE = () => TUNE.routeLength / 12000;
const pFromNY = z => clamp((ROUTE_HALF() - z) / TUNE.routeLength, -0.3, 1.3);

function mountainGauss(z) {
  const zc = -1500 * ROUTE_SCALE();
  const w = 430 * ROUTE_SCALE();
  const d = (z - zc) / w;
  return Math.exp(-d * d);
}

function canyonT(z) {
  const zc = -3800 * ROUTE_SCALE();
  const half = 150 * ROUTE_SCALE();
  return clamp(1 - Math.abs(z - zc) / half, 0, 1);
}

function lakeShape(x, z) {
  const cx = -350 * ROUTE_SCALE(), cz = 1800 * ROUTE_SCALE();
  const rx = 640 * ROUTE_SCALE(), rz = 420 * ROUTE_SCALE();
  const nx = (x - cx) / rx, nz = (z - cz) / rz;
  return (nx * nx + nz * nz < 1) ? smoothstep(0.3, 1, nx * nx + nz * nz) : 0;
}

function coastDrop(z) {
  const edge = ROUTE_HALF() + 500 * ROUTE_SCALE();
  const over = Math.max(z - edge, -(z + edge));
  return over <= 0 ? 0 : smoothstep(0, 700 * ROUTE_SCALE(), over) * 16;
}

function desertMask(z) {
  const p = pFromNY(z);
  return smoothstep(0.70, 0.76, p) * (1 - smoothstep(0.84, 0.90, p));
}

function farmMask(z) {
  const p = pFromNY(z);
  return smoothstep(0.24, 0.30, p) * (1 - smoothstep(0.42, 0.48, p));
}

function plainsMask(z) {
  const p = pFromNY(z);
  return smoothstep(0.30, 0.38, p) * (1 - smoothstep(0.50, 0.56, p));
}

function shapedTerrain(x, z) {
  let h = rawHeight(x, z);
  h *= 1 - desertMask(z) * 0.62;
  if (mountainGauss(z) > 0.01) {
    h += mountainGauss(z) * (48 + valueNoise(x / 460 + 91, z / 260) * 78) * TUNE.continentCompression;
  }
  const ct = canyonT(z);
  if (ct > 0) {
    h -= ct * ct * 72 * TUNE.continentCompression;
    h += valueNoise(x / 90 + 7, z / 55) * ct * 6;
  }
  const lk = lakeShape(x, z);
  if (lk > 0) h -= lk * 14;
  h -= coastDrop(z);
  const harborZ = ROUTE_HALF() - 420;
  if (Math.abs(x) < 2400 && Math.abs(z - harborZ) < 320) {
    const hd = Math.max(0, 1 - Math.abs(Math.abs(z - harborZ) - 60) / 130);
    h -= hd * 9;
  }
  return h;
}

const AIRPORTS = [

  { cz: -ROUTE_HALF(), elev: Math.max(shapedTerrain(0, -ROUTE_HALF()), TUNE.waterLevel + 2) }
];

function flattenMask(x, z) {
  let m = 0;
  for (let i = 0; i < AIRPORTS.length; i++) {
    const nx = Math.max(Math.abs(x) - TUNE.runwayWidth * 0.5 - 40, 0) / TUNE.flattenMargin;
    const dzAbs = Math.abs(z - AIRPORTS[i].cz);
    const nz = Math.max(TUNE.runwayLength * 0.5 + 60 - dzAbs, 0) / TUNE.flattenMargin;
    m = Math.max(m, 1 - smoothstep(0, 1, Math.max(nx, nz)));
  }
  return m;
}

function onAnyRunwayRect(x, z) {
  for (let i = 0; i < AIRPORTS.length; i++) {
    if (Math.abs(x) <= TUNE.runwayWidth / 2 + 12 &&
        Math.abs(z - AIRPORTS[i].cz) <= TUNE.runwayLength / 2 + 12) return true;
  }
  return false;
}

function terrainEff(x, z) {
  const m = flattenMask(x, z);
  if (m <= 0.001) return shapedTerrain(x, z);
  let best = AIRPORTS[0];
  let bd = Math.abs(z - AIRPORTS[0].cz);
  for (let i = 1; i < AIRPORTS.length; i++) {
    const d = Math.abs(z - AIRPORTS[i].cz);
    if (d < bd) { bd = d; best = AIRPORTS[i]; }
  }
  return shapedTerrain(x, z) * (1 - m) + best.elev * m;
}

function buildChunk(cx, cz) {
  const cs = TUNE.chunkSize;
  const geo = new THREE.PlaneGeometry(cs, cs, TUNE.chunkSegments, TUNE.chunkSegments);
  geo.rotateX(-Math.PI / 2);
  const ox = cx * cs, oz = cz * cs;
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, terrainEff(pos.getX(i) + ox, pos.getZ(i) + oz));
  }

  const flat = geo.toNonIndexed();
  geo.dispose();
  const fp = flat.attributes.position;
  const colors = new Float32Array(fp.count * 3);
  const hSpan = TUNE.colorHighHeight - TUNE.colorLowHeight;
  const shoreLo = TUNE.waterLevel - 1.2;
  const shoreHi = TUNE.waterLevel + 1.4;
  for (let f = 0; f < fp.count; f += 3) {
    const hy = (fp.getY(f) + fp.getY(f + 1) + fp.getY(f + 2)) / 3;
    if (hy < shoreHi) {
      tmpColor.copy(cSand).multiplyScalar(hy < shoreLo ? 0.78 : lerp(0.85, 1.02, smoothstep(shoreLo, shoreHi, hy)));
    } else {
      const t = clamp((hy - TUNE.colorLowHeight) / hSpan, 0, 1);
      if (t < 0.5) tmpColor.copy(cLow).lerp(cMid, t * 2);
      else tmpColor.copy(cMid).lerp(cHigh, (t - 0.5) * 2);
    }
    const wx = ox + fp.getX(f), wz = oz + fp.getZ(f);
    const j = 1 + (hash2(Math.round(fp.getX(f)), Math.round(fp.getZ(f))) - 0.5) * 2 * TUNE.colorJitter;
    if (mountainGauss(wz) > 0.3 && hy > 46) {
      tmpColor.lerp(cSnow, smoothstep(46, 66, hy));
    }
    const ct = canyonT(wz);
    if (ct > 0.1) tmpColor.lerp(cRock, Math.min(0.9, ct * 1.6));
    const fm = farmMask(wz);
    if (fm > 0 && hy > TUNE.waterLevel + 2) {
      tmpColor.lerp(valueNoise(wx / 260 + 55, wz / 200) > 0.5 ? cFarmA : cFarmB, fm * 0.75);
    }
    const pm = plainsMask(wz);
    if (pm > 0 && hy > TUNE.waterLevel + 2) tmpColor.lerp(cPlains, pm * 0.55);
    const dm = desertMask(wz);
    if (dm > 0) tmpColor.lerp(cDesert, dm * 0.8);
    for (let v = 0; v < 3; v++) {
      colors[(f + v) * 3] = tmpColor.r * j;
      colors[(f + v) * 3 + 1] = tmpColor.g * j;
      colors[(f + v) * 3 + 2] = tmpColor.b * j;
    }
  }
  flat.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  flat.computeVertexNormals();

  const mesh = new THREE.Mesh(flat, terrainMat);
  mesh.position.set(ox, 0, oz);
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  return mesh;
}

const chunks = new Map();
let lastCellX = null, lastCellZ = null;

function updateChunks(px, pz) {
  const cs = TUNE.chunkSize;
  const ccx = Math.round(px / cs), ccz = Math.round(pz / cs);
  if (ccx === lastCellX && ccz === lastCellZ) return;
  lastCellX = ccx;
  lastCellZ = ccz;

  const need = new Set();
  for (let dx = -TUNE.chunkRadius; dx <= TUNE.chunkRadius; dx++) {
    for (let dz = -TUNE.chunkRadius; dz <= TUNE.chunkRadius; dz++) {
      const k = (ccx + dx) + "," + (ccz + dz);
      need.add(k);
      if (!chunks.has(k)) {
        const m = buildChunk(ccx + dx, ccz + dz);
        chunks.set(k, m);
        scene.add(m);
      }
    }
  }
  for (const [k, m] of chunks) {
    if (!need.has(k)) {
      scene.remove(m);
      m.geometry.dispose();
      chunks.delete(k);
    }
  }
}

}

const landmarkCells = new Map();
const blinkers = [];
const dummyObj = new THREE.Object3D();

function placeLandmark(cellX, cellZ) {
  const cxw = cellX * TUNE.landmarkGrid, czw = cellZ * TUNE.landmarkGrid;
  const isTower = hashSalt(cellX, cellZ, 91) < 0.5;
  let lx = cxw + (hashSalt(cellX, cellZ, 92) - 0.5) * TUNE.landmarkGrid * 0.5;
  let lz = czw + (hashSalt(cellX, cellZ, 93) - 0.5) * TUNE.landmarkGrid * 0.5;
  if (Math.abs(lx) < 1700 && Math.abs(lz) < 1700) return null;
  if (inCorridor(lx, lz, 200)) return null;
  const proto = isTower ? towerProto : bridgeProto;
  const inst = proto.clone();
  const solids = [];
  if (isTower) {
    const gy = terrainEff(lx, lz);
    if (gy < TUNE.waterLevel + 1) return null;
    inst.position.set(lx, gy, lz);
    if (inst.userData.blinker) blinkers.push(inst.userData.blinker);
    solids.push({ x: lx, z: lz, hw: 9, hd: 9, y0: gy, y1: gy + 101 });
  } else {
    let deckY = TUNE.waterLevel + 15;
    let overWater = true;
    for (let s = -1; s <= 1; s += 0.5) {
      if (terrainEff(lx + s * 140, lz) > TUNE.waterLevel + 2.5) overWater = false;
    }
    if (!overWater) deckY = terrainEff(lx, lz) + 15;
    inst.position.set(lx, deckY, lz);
    inst.rotation.y = (hashSalt(cellX, cellZ, 94) < 0.5 ? 0 : Math.PI / 2);
    if (inst.rotation.y > 0.1) {
      solids.push({ x: lx, z: lz, hw: 10, hd: 185, y0: deckY - 4, y1: deckY + 24 });
    } else {
      solids.push({ x: lx, z: lz, hw: 185, hd: 10, y0: deckY - 4, y1: deckY + 24 });
    }
  }
  scene.add(inst);
  streamedSolids.set(cellX + "," + cellZ, solids);
  return inst;
}

function syncLandmarks(px, pz) {
  const grid = TUNE.landmarkGrid;
  const ccx = Math.round(px / grid), ccz = Math.round(pz / grid);
  const R = Math.ceil((TUNE.sceneryRadius + 400) / grid);
  const need = new Set();
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      const cx = ccx + dx, cz = ccz + dz;
      const k = cx + "," + cz;
      if (hashSalt(cx, cz, 90) >= TUNE.landmarkChance) continue;
      need.add(k);
      if (!landmarkCells.has(k)) {
        const inst = placeLandmark(cx, cz);
        landmarkCells.set(k, inst);
      } else if (landmarkCells.get(k) === null) {
        landmarkCells.set(k, placeLandmark(cx, cz));
      }
    }
  }
  for (const [k, inst] of landmarkCells) {
    if (!need.has(k)) {
      if (inst) {
        scene.remove(inst);
        const bi = blinkers.indexOf(inst.userData.blinker);
        if (bi >= 0) blinkers.splice(bi, 1);
      }
      streamedSolids.delete(k);
      landmarkCells.delete(k);
    }
  }
}

function rebuildTrees(px, pz) {
  const cs = TUNE.treeCell;
  const R = Math.ceil(TUNE.sceneryRadius / cs);
  const ccx = Math.round(px / cs), ccz = Math.round(pz / cs);
  let ti = 0;
  outer:
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      const cx = ccx + dx, cz = ccz + dz;
      if (hashSalt(cx, cz, 41) >= TUNE.treeDensity) continue;
      const n = 1 + Math.floor(hashSalt(cx, cz, 42) * TUNE.treeMaxPerCell);
      for (let k = 0; k < n; k++) {
        if (ti >= TUNE.treeMaxInstances) break outer;
        const wx = (cx + hashSalt(cx * 5 + k, cz, 43)) * cs;
        const wz = (cz + hashSalt(cx, cz * 5 + k, 44)) * cs;
        if (flattenMask(wx, wz) > 0.02) continue;
        if (inCorridor(wx, wz, -80)) continue;
        const gy = terrainEff(wx, wz);
        if (gy < TUNE.waterLevel + 1.6) continue;
        const palm = pFromNY(wz) < 0.055;
        const s = 0.8 + hashSalt(cx + k, cz - k, 45) * 0.9;
        const sy = s * (0.9 + hashSalt(cx, cz, 47) * 0.5) * (palm ? 1.75 : 1);
        dummyObj.position.set(wx, gy - 0.3, wz);
        dummyObj.rotation.set(0, hashSalt(cx, cz, 46) * Math.PI * 2, 0);
        dummyObj.scale.set(palm ? s * 0.5 : s, sy, palm ? s * 0.5 : s);
        dummyObj.updateMatrix();
        trunkInst.setMatrixAt(ti, dummyObj.matrix);
        canopyInst.setMatrixAt(ti, dummyObj.matrix);
        if (palm) {
          dummyObj.position.y = gy + sy * 4;
          dummyObj.scale.set(s * 1.2, s * 0.5, s * 1.2);
          dummyObj.updateMatrix();
          canopyInst.setMatrixAt(ti, dummyObj.matrix);
        }
        tmpColor.setHex(palm ? 0x2f7a3f : TUNE.treeCanopyColor).multiplyScalar(0.82 + hashSalt(cx - k, cz + k, 48) * 0.4);
        canopyInst.setColorAt(ti, tmpColor);
        ti++;
      }
    }
  }
  trunkInst.count = ti;
  canopyInst.count = ti;
  trunkInst.instanceMatrix.needsUpdate = true;
  canopyInst.instanceMatrix.needsUpdate = true;
  if (canopyInst.instanceColor) canopyInst.instanceColor.needsUpdate = true;
}

function rebuildBuildings(px, pz) {
  const grid = TUNE.townGrid;
  const R = Math.ceil(TUNE.sceneryRadius / grid);
  const ccx = Math.round(px / grid), ccz = Math.round(pz / grid);
  let bi = 0;
  buildingBoxes.length = 0;
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      if (bi >= TUNE.buildingMaxInstances) break;
      const cx = ccx + dx, cz = ccz + dz;
      if (hashSalt(cx, cz, 61) >= TUNE.townChance) continue;
      const tcx = (cx + 0.5 + (hashSalt(cx, cz, 62) - 0.5) * 0.6) * grid;
      const tcz = (cz + 0.5 + (hashSalt(cx, cz, 63) - 0.5) * 0.6) * grid;
      if (inCorridor(tcx, tcz, -60)) continue;
      const n = TUNE.townBuildingsMin + Math.floor(hashSalt(cx, cz, 64) * (TUNE.townBuildingsMax - TUNE.townBuildingsMin + 1));
      for (let k = 0; k < n; k++) {
        if (bi >= TUNE.buildingMaxInstances) break;
        const ang = hashSalt(cx * 7 + k, cz, 65) * Math.PI * 2;
        const rad = (0.25 + hashSalt(cx * 7 + k, cz * 7 + k, 66) * 0.75) * grid * 0.33;
        const wx = tcx + Math.cos(ang) * rad;
        const wz = tcz + Math.sin(ang) * rad;
        if (flattenMask(wx, wz) > 0.02 || inCorridor(wx, wz, -40)) continue;
        const gy = terrainEff(wx, wz);
        if (gy < TUNE.waterLevel + 1.8) continue;
        const w = 8 + hashSalt(cx + k, cz, 67) * 14;
        const d = 8 + hashSalt(cx, cz + k, 68) * 14;
        const hgt = 6 + hashSalt(cx + k, cz - k, 69) * 20;
        dummyObj.position.set(wx, gy - 0.3, wz);
        dummyObj.rotation.set(0, Math.round(hashSalt(cx, cz, 70) * 4) * Math.PI / 2 + (hashSalt(cx, cz, 71) - 0.5) * 0.2, 0);
        dummyObj.scale.set(w, hgt, d);
        dummyObj.updateMatrix();
        buildingInst.setMatrixAt(bi, dummyObj.matrix);
        tmpColor.setHex(BUILDING_PALETTE[Math.floor(hashSalt(cx + k, cz + k, 72) * BUILDING_PALETTE.length)]);
        buildingInst.setColorAt(bi, tmpColor);
        buildingBoxes.push({ x: wx, z: wz, hw: w / 2, hd: d / 2, top: gy - 0.3 + hgt, idx: bi });
        bi++;
      }
    }
  }
  buildingInst.count = bi;
  buildingInst.instanceMatrix.needsUpdate = true;
  if (buildingInst.instanceColor) buildingInst.instanceColor.needsUpdate = true;
}

let scenCenterX = null, scenCenterZ = null;
function updateScenery(px, pz, force) {
  if (!force && scenCenterX !== null) {
    const dx = px - scenCenterX, dz = pz - scenCenterZ;
    if (dx * dx + dz * dz < TUNE.sceneryRebuildDist * TUNE.sceneryRebuildDist) return;
  }
  scenCenterX = px;
  scenCenterZ = pz;
  rebuildTrees(px, pz);
  rebuildBuildings(px, pz);
  syncLandmarks(px, pz);
}

const matCache = {};
function lam(color) {
  if (!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({ color });
  return matCache[color];
}
const staticSolids = [];
function addSolidBox(x, y0, z, hw, hd, y1, mesh) {
  staticSolids.push({ x, y0, z, hw, hd, y1, mesh });
}
function lmBox(g, w, h, d, color, x, y, z, solid) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(color));
  m.position.set(x, y, z);
  g.add(m);
  if ((solid === undefined || solid) && g.userData.trackSolids) {
    g.userData.pending.push({ lx: x, ly0: y - h / 2, lz: z, hw: w / 2, hd: d / 2, y1: y + h / 2, mesh: m });
    m.userData.shatterable = true;
  }
  return m;
}
function lmCyl(g, rT, rB, h, color, x, y, z, seg, solid) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, seg || 8), lam(color));
  m.position.set(x, y, z);
  g.add(m);
  if ((solid === undefined || solid) && g.userData.trackSolids) {
    const r = Math.max(rT, rB);
    g.userData.pending.push({ lx: x, ly0: y - h / 2, lz: z, hw: r, hd: r, y1: y + h / 2, mesh: m });
    m.userData.shatterable = true;
  }
  return m;
}

const ROUTE_LANDMARKS = [];
function addRouteLandmark(g, x, z) {
  g.position.set(x, terrainEff(x, z) - 0.5, z);
  scene.add(g);
  ROUTE_LANDMARKS.push({ g, x, z });
  if (g.userData.pending) {
    for (const p of g.userData.pending) {
      addSolidBox(x + p.lx, p.ly0 + g.position.y, z + p.lz, p.hw, p.hd, p.y1 + g.position.y, p.mesh);
    }
  }
}

function suspensionBridge(cableColor, len, towerH, deckY, deckW) {
  const g = new THREE.Group();
  g.userData.trackSolids = true;

  for (const sx of [-len / 2 + 55, len / 2 - 55]) {
    lmBox(g, 13, towerH, 11, 0x8a4a3a, sx, deckY + towerH / 2, 0);
    lmBox(g, 13, towerH, 11, 0x8a4a3a, sx, deckY + towerH / 2, deckW);
  }
  lmBox(g, len, 4.5, deckW + 2, 0x9aa2ad, 0, deckY, deckW / 2);
  for (const sz of [0, deckW]) {
    lmBox(g, len * 0.44, 1.6, 1.6, cableColor, -len * 0.28, deckY + towerH * 0.4, sz, false);

  }
  return g;
}

let audioCtx = null;
let masterGain = null;
let engineNodes = null;

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) {
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  startEngine();
}

function startEngine() {
  if (engineNodes || !audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = "sawtooth";
  o.frequency.value = TUNE.engineFreqIdle;
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = TUNE.engineFilterFreq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(TUNE.engineGainIdle, t + 0.8);
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = TUNE.engineLfoRate;
  const lfoG = audioCtx.createGain();
  lfoG.gain.value = TUNE.engineGainIdle * 0.25;
  lfo.connect(lfoG);
  lfoG.connect(g.gain);
  o.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  o.start(t);
  lfo.start(t);
  engineNodes = { o, lfo, g };
}

let lastEngineNorm = 1;
function setEngine(speedNorm) {
  lastEngineNorm = speedNorm;
  if (!engineNodes || !audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;
  const off = speedNorm <= 0.02;
  const gainTarget = off ? 0.0004 : lerp(TUNE.engineGainIdle, TUNE.engineGainMax, speedNorm);
  const freqTarget = off ? TUNE.engineFreqIdle * 0.55 : lerp(TUNE.engineFreqIdle, TUNE.engineFreqMax, speedNorm);
  engineNodes.o.frequency.setTargetAtTime(freqTarget, t, 0.18);
  engineNodes.g.gain.setTargetAtTime(gainTarget, t, 0.22);
}

function synthBlip(type, f0, f1, dur, peak, when) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(masterGain);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function noiseBurst(dur, freq, peak, when) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime + (when || 0);
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = freq;
  bp.Q.value = 0.9;
  const g = audioCtx.createGain();
  g.gain.value = peak;
  src.connect(bp);
  bp.connect(g);
  g.connect(masterGain);
  src.start(t);
}

let shakeAmp = 0;

function triggerExplosion(nx, ny, nz, intensity) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.alive = true;
    p.kind = i % 3;
    p.maxLife = (p.kind === 1 ? 1.9 : 1.3) + rnd() * 0.7;
    p.life = p.maxLife;
    const sp = (16 + rnd() * 34) * (0.7 + intensity * 0.5);
    const th = rnd() * Math.PI * 2;
    const up = p.kind === 1 ? 0.6 + rnd() * 0.5 : rnd() * 1.2 - 0.15;
    const side = Math.sqrt(Math.max(0, 1 - up * up));
    p.px = nx; p.py = ny; p.pz = nz;
    p.vx = Math.cos(th) * side * sp;
    p.vz = Math.sin(th) * side * sp;
    p.vy = Math.abs(up) * sp;
    p.rx = rnd() * Math.PI; p.ry = rnd() * Math.PI;
    p.rvx = (rnd() - 0.5) * 9; p.rvy = (rnd() - 0.5) * 9;
    p.size = p.kind === 1 ? 1.6 + rnd() * 1.6 : 0.7 + rnd() * 1.3;
  }
  for (const fb of fireballs) {
    fb.visible = true;
    fb.position.set(nx, ny + 2, nz);
    fb.position.x += (rnd() - 0.5) * 8;
    fb.userData.t = 0;
    fb.userData.dur = 0.5 + rnd() * 0.25;
  }
  debrisMesh.visible = true;
  shakeAmp = 1;
  boomSound();
  flags.exploded++;
}

function updateExplosion(dt, homePos, seeking) {
  let anyAlive = false;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p.alive || p.life <= 0) {
      if (p.alive) p.alive = false;
      dummyObj.position.set(0, -9999, 0);
      dummyObj.scale.setScalar(0.001);
      dummyObj.rotation.set(0, 0, 0);
      dummyObj.updateMatrix();
      debrisMesh.setMatrixAt(i, dummyObj.matrix);
      continue;
    }
    anyAlive = true;
    p.life -= dt;
    if (seeking && p.life < 0.55) {
      p.px += (homePos.x - p.px) * Math.min(1, 9 * dt);
      p.py += (homePos.y - p.py) * Math.min(1, 9 * dt);
      p.pz += (homePos.z - p.pz) * Math.min(1, 9 * dt);
    } else {
      const grav = p.kind === 2 ? -30 : (p.kind === 1 ? 5 : -9);
      p.vy += grav * dt;
      p.vx *= 1 - Math.min(1, 1.1 * dt);
      p.vz *= 1 - Math.min(1, 1.1 * dt);
      p.px += p.vx * dt; p.py += p.vy * dt; p.pz += p.vz * dt;
    }
    p.rx += p.rvx * dt; p.ry += p.rvy * dt;
    const fade = clamp(p.life / 0.4, 0, 1);
    dummyObj.position.set(p.px, p.py, p.pz);
    dummyObj.rotation.set(p.rx, p.ry, 0);
    dummyObj.scale.setScalar(Math.max(0.01, p.size * (p.kind === 1 ? (2 - p.life / p.maxLife) : fade)));
    dummyObj.updateMatrix();
    debrisMesh.setMatrixAt(i, dummyObj.matrix);
    tmpColor.setHex(p.kind === 0 ? FIRE_COLS[i % FIRE_COLS.length] : (p.kind === 1 ? SMOKE_COL : METAL_COL));
    debrisMesh.setColorAt(i, tmpColor);
  }
  debrisMesh.instanceMatrix.needsUpdate = true;
  if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;
  if (!anyAlive && !seeking) debrisMesh.visible = false;
  for (const fb of fireballs) {
    if (!fb.visible) continue;
    fb.userData.t += dt;
    const tt = fb.userData.t / fb.userData.dur;
    if (tt >= 1) { fb.visible = false; fb.material.opacity = 0; continue; }
    fb.scale.setScalar(3 + tt * 16);
    fb.material.opacity = 0.9 * (1 - tt);
  }
}

function updateVehicleModel(dt) {
  if (!vehicleModel) return;
  const chaseVisible = state.viewChase && !state.exploding;
  vehicleModel.visible = chaseVisible;
  if (!chaseVisible) return;
  const wheelDrop = state.vp.hasGear ? 1.9 * (state.vp.size || 1) : 0.6;
  vehicleModel.position.set(state.x, state.y - TUNE.gearHeight + wheelDrop, state.z);
  vehicleModel.rotation.set(state.pitch * DEG, state.heading, -state.bank * DEG);
  if (vehicleModel.userData.rotor) vehicleModel.userData.rotor.rotation.y += dt * 26;
  if (vehicleModel.userData.propDisc) vehicleModel.userData.propDisc.rotation.z += dt * 40;
  if (vehicleModel.userData.flame) {
    vehicleModel.userData.flame.scale.y = 0.8 + Math.random() * 0.5;
    vehicleModel.userData.flame.visible = state.speed > 2;
  }
  if (vehicleModel.userData.gear) {
    const a = clamp(state.gearAnim, 0.001, 1);
    vehicleModel.userData.gear.scale.y = a;
    vehicleModel.userData.gear.visible = a > 0.03;
  }
}

function applyCamera(dt) {
  if (state.viewChase) {
    const vs = state.vp.size || 1;
    const fx = -Math.sin(state.heading), fz = -Math.cos(state.heading);
    camDesired.set(state.x - fx * 30 * vs, state.y + 11 * vs + 3, state.z - fz * 30 * vs);
    camera.position.lerp(camDesired, Math.min(1, 6 * dt));
    lookV.set(state.x + fx * 26, state.y + 2, state.z + fz * 26);
    camera.lookAt(lookV);
    camera.position.x += (Math.random() - 0.5) * 9 * shakeAmp;
    camera.position.y += (Math.random() - 0.5) * 7 * shakeAmp;
    camera.position.z += (Math.random() - 0.5) * 9 * shakeAmp;
  } else {
    camera.position.set(
      state.x + (Math.random() - 0.5) * 11 * shakeAmp,
      state.y + (Math.random() - 0.5) * 9 * shakeAmp,
      state.z + (Math.random() - 0.5) * 11 * shakeAmp
    );
    camera.rotation.set(state.pitch * DEG, state.heading, -state.bank * DEG);
  }
}

const hiddenPieces = [];
const zeroedTown = [];

function shatterAround(px, py, pz) {
  forEachSolid(b => {
    if (hiddenPieces.length >= 10) return;
    const dx = Math.max(b.x - b.hw - px, px - (b.x + b.hw), 0);
    const dz = Math.max(b.z - b.hd - pz, pz - (b.z + b.hd), 0);
    const dy = Math.max(b.y0 - py, py - b.y1, 0);
    if (dx * dx + dz * dz + dy * dy > 70 * 70) return;
    if (b.mesh && b.mesh.visible !== false) {
      b.mesh.visible = false;
      hiddenPieces.push({ kind: "mesh", mesh: b.mesh });
    } else if (b.idx !== undefined) {
      const m = new THREE.Matrix4();
      buildingInst.getMatrixAt(b.idx, m);
      zeroedTown.push({ idx: b.idx, mat: m });
      dummyObj.position.set(0, -9999, 0);
      dummyObj.scale.setScalar(0.001);
      dummyObj.updateMatrix();
      buildingInst.setMatrixAt(b.idx, dummyObj.matrix);
      buildingInst.instanceMatrix.needsUpdate = true;
    }
  });
}

function restoreShattered() {
  for (const h of hiddenPieces) {
    if (h.kind === "mesh") h.mesh.visible = true;
    else {
      buildingInst.setMatrixAt(h.idx, h.mat);
      buildingInst.instanceMatrix.needsUpdate = true;
    }
  }
  hiddenPieces.length = 0;
  zeroedTown.length = 0;
}

function resolveSolidWalls() {
  if (state.exploding || state.phase !== "AIRBORNE") return;
  flags.wallChecks = (flags.wallChecks || 0) + 1;
  const PRAD = 3;
  let hit = null;
  forEachSolid(b => {
    if (hit) return;
    const ex = b.hw + PRAD, ez = b.hd + PRAD;
    if (!(state.x > b.x - ex && state.x < b.x + ex &&
          state.z > b.z - ez && state.z < b.z + ez)) return;
    if (!(state.y > b.y0 - PRAD && state.y < b.y1 + PRAD)) return;
    const pens = [
      { d: (b.x + ex) - state.x, nx: -1, nz: 0 },
      { d: state.x - (b.x - ex), nx: -1, nz: 0 },
      { d: (b.z + ez) - state.z, nz: -1, nx: 0 },
      { d: state.z - (b.z - ez), nz: 1, nx: 0 },
      { d: (b.y1 + PRAD) - state.y, ny: 1 },
      { d: state.y - (b.y0 - PRAD), ny: -1 },
    ];
    let best = pens[0];
    for (const q of pens) if (q.d < best.d) best = q;
    hit = { b, best };
  });
  if (!hit) return;
  flags.wallHits = (flags.wallHits || 0) + 1;
  const { best } = hit;
  const vx = -Math.sin(state.heading) * Math.cos(state.pitch * DEG) * state.speed;
  const vz = -Math.cos(state.heading) * Math.cos(state.pitch * DEG) * state.speed;
  const vy = Math.sin(state.pitch * DEG) * state.speed + (state.airVy || 0);
  shatterAround(state.x, state.y, state.z);
  triggerExplosion(state.x, state.y, state.z, clamp(state.speed / 80, 0, 1));
  state.exploding = true;
  state.explodeTimer = TUNE.reassembleDelay;
  safePos.x = state.x + best.nx * 30;
  safePos.z = state.z + (best.nz || 0) * 30;
  safePos.y = Math.max(
    Math.max(terrainEff(safePos.x, safePos.z), TUNE.waterLevel) + 60,
    state.y + 40
  );
}

const forward = new THREE.Vector3();

function groundPhase(dt) {
  const grounded = state.phase === "TAXI" || state.phase === "ROLL";
  if (!grounded) return;
  const ap = AIRPORTS[state.originIdx];
  const sgn = state.dirIdx === 0 ? 1 : -1;
  state.x = 0;
  state.pitch += (0 - state.pitch) * Math.min(1, 8 * dt);
  state.bank += (0 - state.bank) * Math.min(1, 8 * dt);
  state.heading = state.dirIdx === 0 ? 0 : Math.PI;
  state.y = ap.elev + TUNE.gearHeight;
  state.airVy = null;

  if (state.phase === "TAXI") {
    state.speed = 0;
    if (state.throttleHeld) state.phase = "ROLL";
    return;
  }

  if (state.throttleHeld) {
    state.speed = Math.min(state.speed + state.vp.accel * dt, state.vp.cruiseSpeed * 1.15);
  } else {
    state.speed = Math.max(state.speed - TUNE.brakeDecel * dt, 0);
  }

  state.z -= sgn * state.speed * dt;

  if (state.speed >= TUNE.rotateSpeed) {
    state.canRotate = true;
  }
  if (state.canRotate && state.ctrlPitch > TUNE.rotateStickThreshold) {
    state.rotatePullTime += dt;
    if (state.rotatePullTime >= TUNE.rotateStickTime) {
      state.phase = "AIRBORNE";
      state.liftoffTimer = TUNE.liftoffHoldTime;
      state.pitch = TUNE.liftoffPitchDeg * 0.5;
      flags.liftoff++;
    }
  } else {
    state.rotatePullTime = 0;
  }

  const pastEnd = sgn * (ap.cz - state.z) > TUNE.runwayLength / 2 + 40;
  if (pastEnd || (!state.throttleHeld && state.speed <= 0.01)) {
    if (pastEnd) {
      state.speed = Math.max(state.speed - TUNE.brakeDecel * 2 * dt, 0);
      if (state.speed <= 0.01) spawnForTakeoff(state.originIdx, state.dirIdx);
    } else {
      state.phase = "TAXI";
    }
  }
}

function updateAssists(dt) {
  const t = Math.abs(wrapPi(state.heading)) < Math.PI / 2 ? 0 : Math.PI;
  const thOff = Math.round(Math.cos(t)) * (TUNE.runwayLength / 2);
  const dxr = state.x - 0;
  const dzr = state.z - (AIRPORTS[state.destIdx].cz + thOff);
  const distHoriz = Math.sqrt(dxr * dxr + dzr * dzr);

  const ft = { x: -Math.sin(t), z: -Math.cos(t) };
  const rt = { x: Math.cos(t), z: -Math.sin(t) };
  const along = dxr * ft.x + dzr * ft.z;
  const lat = dxr * rt.x + dzr * rt.z;
  state.approachData = { t, along, lat };

  const dot = (-Math.sin(state.heading) * -dxr + -Math.cos(state.heading) * -dzr) / (distHoriz || 1);
  state.engaged = state.phase === "AIRBORNE"
    && state.liftoffTimer <= 0
    && distHoriz < TUNE.approachEngageDist
    && dot > 0.25;

  if (!state.engaged) {
    state.assistBias *= Math.max(0, 1 - 2.5 * dt);
    return;
  }

  state.approachLatch = true;

  const err = wrapPi(t - state.heading);
  const falloff = 1 - smoothstep(TUNE.alignStartDist * 0.5, TUNE.approachEngageDist, distHoriz);

  const dH = clamp(err * TUNE.alignHeadingGain, -TUNE.alignHeadingMaxRateDeg * DEG, TUNE.alignHeadingMaxRateDeg * DEG);
  state.heading += dH * falloff * dt;

  const biasTarget = -clamp(lat * TUNE.alignLateralGain, -TUNE.alignRollMaxBiasDeg, TUNE.alignRollMaxBiasDeg) * falloff;
  state.assistBias += (biasTarget - state.assistBias) * Math.min(1, 2 * dt);
}

function update(dt) {
  el.gearBtn.classList.toggle("hidden", !state.vp.hasGear);
  el.gearBtn.classList.toggle("gear-up", !state.gearDown);
  el.slowBtn.classList.toggle("hidden", state.phase !== "AIRBORNE" && state.phase !== "CLIMB_AWAY");
  el.slowBtn.classList.toggle("pressed", state.slowHeld);
  const gT = state.gearDown ? 1 : 0;
  if (state.gearAnim !== gT) {
    state.gearAnim = clamp(state.gearAnim + (gT > state.gearAnim ? 1 : -1) * 1.7 * dt, 0, 1);
  }
  if (state.exploding) {
    state.explodeTimer -= dt;
    const seeking = state.explodeTimer <= 0.5;
    updateExplosion(dt, safePos, seeking);
    shakeAmp = Math.max(0, shakeAmp - dt * 0.9);
    setEngine(0.01);
    updateChunks(state.x, state.z);
    skyDome.position.set(state.x, state.y, state.z);
    waterMesh.position.set(state.x, TUNE.waterLevel, state.z);
    applyCamera(dt);
    updateVehicleModel(dt);
    updateHud();
    updateFx(dt);
    shakeAmp = Math.max(0, shakeAmp - dt * 0.9);
    if (state.explodeTimer <= 0) {
      state.exploding = false;
      state.x = safePos.x;
      state.y = safePos.y;
      state.z = safePos.z;
      state.speed = state.vp.cruiseSpeed * 0.6;
      state.pitch = 0;
      state.bank = 0;
      state.airVy = null;
      state.bounceTimer = 0;
      state.canRotate = false;
      state.approachLatch = false;
      whoosh();
      restoreShattered();
    }
    return;
  }
  let targetBank = 0, targetPitch = 0;
  if (state.touching) {
    targetBank = state.ctrlBank * state.vp.bankLimitDeg;
    targetPitch = state.ctrlPitch * state.vp.pitchLimitDeg;
  }

  if (state.phase === "TAXI" || state.phase === "ROLL") {
    groundPhase(dt);
    setEngine(state.speed / state.vp.cruiseSpeed);
    el.throttleBtn.classList.remove("hidden");
    el.rotateArrow.classList.toggle("on",
      state.phase === "ROLL" && state.canRotate);
  } else {
    el.throttleBtn.classList.add("hidden");
    el.rotateArrow.classList.remove("on");

    let resp = state.touching ? TUNE.controlResponse : TUNE.autoLevelResponse;
    let turnCoupling = true;

    if (state.phase === "CLIMB_AWAY") {
      state.climbAwayTimer -= dt;
      targetPitch = TUNE.climbAwayPitchDeg;
      targetBank = 0;
      resp = TUNE.controlResponse;
      state.assistBias *= Math.max(0, 1 - 3 * dt);
      state.speed += (state.vp.cruiseSpeed - state.speed) * Math.min(1, 1.2 * dt);
      if (state.climbAwayTimer <= 0) {
        state.phase = "AIRBORNE";
        flags.missed++;
      }
    } else if (state.phase === "LANDED") {
      state.speed = Math.max(state.speed - TUNE.brakeDecel * 0.55 * dt, 0);
      targetPitch = 0;
      targetBank = 0;
      resp = 4;
      turnCoupling = false;
      state.assistBias = 0;
      const adR = state.approachData;
      if (adR && Math.abs(adR.along) < TUNE.runwayLength) {
        state.heading += wrapPi(adR.t - state.heading) * Math.min(1, 1.5 * dt);
      }
      if (state.speed <= 0.05 && !state.celebrated) {
        state.celebrated = true;
        confettiBurst();
        cheer();
        state.celebrateTimer = 2.6;
      }
      if (state.celebrated) {
        state.celebrateTimer -= dt;
        if (state.celebrateTimer <= 0) {
          state.originIdx = state.destIdx;
          state.dirIdx = 1 - state.dirIdx;
          spawnForTakeoff();
        }
      }
    } else {
      updateAssists(dt);
      if (state.liftoffTimer > 0) {
        state.liftoffTimer -= dt;
        targetPitch = TUNE.liftoffPitchDeg;
      }
      if (state.engaged) {
        targetBank += state.assistBias;
      }
      targetBank = clamp(targetBank, -state.vp.bankLimitDeg, state.vp.bankLimitDeg);
      targetPitch = clamp(targetPitch, -state.vp.pitchLimitDeg, state.vp.pitchLimitDeg);
      const hover = state.vp.hoverSpeed > 0 && !state.touching;
      let targetSpeed = hover ? state.vp.hoverSpeed : (state.engaged ? TUNE.approachSpeed : state.vp.cruiseSpeed);
      if (state.slowHeld) targetSpeed = Math.min(targetSpeed, Math.max(20, state.vp.cruiseSpeed * TUNE.slowSpeedFactor));
      state.speed += (targetSpeed - state.speed) * Math.min(1, (hover ? 0.5 : TUNE.autoThrottleResponse * 1.6) * dt);
    }

    const k = Math.min(1, resp * dt);
    state.bank += (targetBank - state.bank) * k;
    state.pitch += (targetPitch - state.pitch) * k;

    const effBank = clamp(state.bank + state.assistBias, -state.vp.bankLimitDeg, state.vp.bankLimitDeg);
    if (turnCoupling) {
      state.heading -= state.vp.turnRateDeg * DEG * (effBank / state.vp.bankLimitDeg) * dt;
    }

    const pr = state.pitch * DEG;
    const hr = state.heading;
    const cp = Math.cos(pr);
    forward.set(-Math.sin(hr) * cp, Math.sin(pr), -Math.cos(hr) * cp);
    state.x += forward.x * state.speed * dt;
    state.z += forward.z * state.speed * dt;
    state.y += forward.y * state.speed * dt;

    setEngine(state.speed / state.vp.cruiseSpeed);

    resolveSolidWalls();
    if (state.exploding) {
      updateHud();
      updateFx(dt);
      return;
    }

    const groundNow = terrainEff(state.x, state.z);
    let contactGround = Math.max(groundNow, TUNE.waterLevel);
    if (groundNow > TUNE.waterLevel + 0.01) contactGround = groundNow;
    for (let i = 0; i < buildingBoxes.length; i++) {
      const bb = buildingBoxes[i];
      if (Math.abs(state.x - bb.x) < bb.hw + 2 && Math.abs(state.z - bb.z) < bb.hd + 2) {
        if (state.y < bb.top + 4) contactGround = Math.max(contactGround, bb.top);
      }
    }

    if (state.phase === "LANDED") {
      state.y = groundNow + TUNE.gearHeight;
    } else {
      const agl = state.y - groundNow;
      const halfW = TUNE.runwayWidth / 2;
      const halfL = TUNE.runwayLength / 2;
      const ad = state.approachData || { t: 0, along: 1e9, lat: 1e9 };
      const withinLat = Math.abs(ad.lat) <= halfW * TUNE.touchdownLatTolMult;
      const overRect = ad.along > -40 && ad.along < halfL && withinLat;

      const gearOk = !state.vp.hasGear || state.gearDown;
      if (state.phase === "AIRBORNE" && overRect && agl <= TUNE.touchdownClearance) {
        if (!gearOk) {
          state.exploding = true;
          state.explodeTimer = TUNE.reassembleDelay;
          safePos.x = state.x;
          safePos.z = state.z;
          safePos.y = groundNow + 60;
          triggerExplosion(state.x, state.y, state.z, clamp(state.speed / 80, 0, 1));
        } else if (Math.abs(wrapPi(state.heading - ad.t)) <= TUNE.touchdownHeadingTolDeg * DEG) {
          state.phase = "LANDED";
          flags.touchdown++;
          chirp();
          state.y = groundNow + TUNE.gearHeight;
        } else {
          state.approachLatch = false;
          state.phase = "CLIMB_AWAY";
          state.climbAwayTimer = TUNE.climbAwayTime;
        }
      } else if (
        state.phase === "AIRBORNE" && state.approachLatch && agl < 45 &&
        (ad.along > halfL + 40 || (ad.along > 60 && !withinLat))
      ) {
        state.approachLatch = false;
        state.phase = "CLIMB_AWAY";
        state.climbAwayTimer = TUNE.climbAwayTime;
      } else if (agl <= TUNE.terrainClearance && !onAnyRunwayRect(state.x, state.z)) {
        state.exploding = true;
        state.explodeTimer = TUNE.reassembleDelay;
        safePos.x = state.x;
        safePos.z = state.z;
        safePos.y = Math.max(groundNow, TUNE.waterLevel) + 60;
        triggerExplosion(state.x, Math.max(state.y - 2, contactGround + 1), state.z, clamp(state.speed / 80, 0, 1));
      }

      if (state.phase === "AIRBORNE" || state.phase === "CLIMB_AWAY") {
        const floorNow = Math.max(terrainEff(state.x, state.z), TUNE.waterLevel);
        if (state.y < floorNow + 0.6) {
          state.y = floorNow + 0.6;
        }
      }
    }
  }

  const aglSpace = state.y - Math.max(terrainEff(state.x, state.z), TUNE.waterLevel);
  let spaceTarget = 0;
  if (!state.vp.capped && state.phase === "AIRBORNE") {
    spaceTarget = clamp((aglSpace - TUNE.spaceAltitude) / TUNE.spaceBlendBand, 0, 1);
  }
  state.spaceF += (spaceTarget - state.spaceF) * Math.min(1, 1.4 * dt);
  if (state.vp.capped && (state.phase === "AIRBORNE" || state.phase === "CLIMB_AWAY")) {
    if (state.y > TUNE.otherVehicleCeiling) {
      state.y = TUNE.otherVehicleCeiling;
      if (state.pitch > -2) state.pitch -= 20 * dt;
    }
  }
  const sf = state.spaceF;
  if (sf > 0.001) {
    skyUniforms.topColor.value.copy(SKY_TOP_BASE).lerp(SPACE_TOP, sf);
    skyUniforms.horizonColor.value.copy(SKY_HOR_BASE).lerp(SPACE_HOR, sf);
    scene.fog.color.copy(skyUniforms.horizonColor.value);
    scene.fog.near = lerp(TUNE.fogNear, 2600, sf);
    scene.fog.far = lerp(TUNE.fogFar, 5400, sf);
  } else if (skyUniforms.topColor.value.getHex() !== TUNE.skyTopColor) {
    skyUniforms.topColor.value.copy(SKY_TOP_BASE);
    skyUniforms.horizonColor.value.copy(SKY_HOR_BASE);
    scene.fog.color.copy(skyUniforms.horizonColor.value);
    scene.fog.near = TUNE.fogNear;
    scene.fog.far = TUNE.fogFar;
  }
  stars.material.opacity = sf;
  earthMesh.material.opacity = sf * 0.96;
  earthMesh.position.set(state.x, state.y - 3600, state.z);
  earthMesh.visible = sf > 0.02;
  astronaut.visible = station.visible = sf > 0.05;
  if (astronaut.visible) {
    astronaut.rotation.y += dt * 0.4;
    astronaut.rotation.x += dt * 0.12;
    station.rotation.y += dt * 0.16;
  }
  waterMesh.visible = sf < 0.9;

  updateChunks(state.x, state.z);
  updateScenery(state.x, state.z, false);
  updateTrain(dt, state.x, state.z);
  cullLandmarks(dt, state.x, state.z);
  skyDome.position.set(state.x, state.y, state.z);
  waterMesh.position.set(state.x, TUNE.waterLevel, state.z);

  const hx = -Math.sin(state.heading), hz = -Math.cos(state.heading);
  for (const c of clouds) {
    const dx = c.position.x - state.x, dz = c.position.z - state.z;
    if (dx * dx + dz * dz > TUNE.fogFar * TUNE.fogFar * 1.44) {
      respawnCloud(c, state.x, state.z, hx, hz, true);
    }
  }

  const pulse = 1 + Math.sin(performance.now() * 0.001 * TUNE.ringPulseRate) * 0.07;
  for (const r of rings) r.scale.setScalar(pulse);
  const blinkOn = Math.sin(performance.now() * 0.004) > -0.3;
  for (const b of blinkers) b.visible = blinkOn;

  applyCamera(dt);
  shakeAmp = Math.max(0, shakeAmp - dt * 0.9);
  updateVehicleModel(dt);

  updateHud();
  updateFx(dt);
  updateExplosion(dt, safePos, false);
}

function updateHomeArrow() {
  if (state.phase !== "AIRBORNE" && state.phase !== "CLIMB_AWAY") {
    el.homeArrow.classList.remove("on");
    return;
  }
  const thz = AIRPORTS[state.destIdx].cz;
  const rx = -state.x, rz = thz - state.z;
  const dist = Math.sqrt(rx * rx + rz * rz);
  if (dist <= TUNE.homeIndicatorDistance || state.engaged) {
    el.homeArrow.classList.remove("on");
    return;
  }
  el.homeArrow.classList.add("on");

  const fx = -Math.sin(state.heading), fz = -Math.cos(state.heading);
  const dot = fx * rx + fz * rz;
  const cross = fx * rz - fz * rx;
  const theta = Math.atan2(cross, dot);

  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const radius = Math.min(cx, cy) - TUNE.homeIndicatorSize * 0.75 - 10;
  const px = cx + Math.sin(theta) * radius;
  const py = cy - Math.cos(theta) * radius;
  el.homeArrow.style.left = px + "px";
  el.homeArrow.style.top = py + "px";
  el.homeArrow.style.transform = `translate(-50%,-50%) rotate(${theta * 180 / Math.PI}deg)`;
}

function updateHud() {
  const asiFrac = clamp(state.speed / TUNE.asiMaxSpeed, 0, 1);
  el.asiNeedle.style.transform = `rotate(${-120 + asiFrac * 240}deg)`;
  const altM = Math.max(0, state.y - Math.max(terrainEff(state.x, state.z), TUNE.waterLevel));
  const altFrac = clamp(altM / TUNE.altMaxMeters, 0, 1);
  el.altNeedle.style.transform = `rotate(${-120 + altFrac * 240}deg)`;
  el.altDigits.textContent = String(Math.round(altM));
  el.aiBall.style.transform = `rotate(${-state.bank}deg) translateY(${clamp(state.pitch, -40, 40) * TUNE.hudPitchPixelsPerDeg}px)`;

  if (state.engaged && state.approachData) {
    const idealY = AIRPORTS[state.destIdx].elev + 3 + Math.max(0, state.approachData.along) * TUNE.glideSlope;
    const diff = state.y - idealY;
    el.glideGuide.classList.add("on");
    el.glideGuide.dataset.state = diff > TUNE.glideBand ? "down" : (diff < -TUNE.glideBand ? "up" : "ok");
  } else {
    el.glideGuide.classList.remove("on");
  }

  updateHomeArrow();
  updateStrip();
}

updateChunks(state.x, state.z);
updateScenery(state.x, state.z, true);
for (const c of clouds) respawnCloud(c, state.x, state.z, 0, -1, false);
grabWakeLock();

window.__lp = {
  TUNE, state, flags, update, terrainEff, ROUTE_LANDMARKS, wrapPi,
  get solidCount(){let n=0;(function it(cb){for(const b of buildingBoxes)cb(b);for(const b of staticSolids)cb(b);for(const arr of streamedSolids.values())for(const b of arr)cb(b);})(()=>n++);return n;},
  get cameraPos(){return camera.position;},
  forEachSolid(cb){for(const b of buildingBoxes)cb(b);for(const b of staticSolids)cb(b);for(const arr of streamedSolids.values())for(const b of arr)cb(b);for(const b of trainSolids)cb(b);}, get vehicleModel(){return vehicleModel;},
  get engineNorm() { return lastEngineNorm; },
  api: {
    setThrottle(v) { state.throttleHeld = !!v; },
    setStick(bank, pitch) {
      state.touching = true;
      state.ctrlBank = clamp(bank, -1, 1);
      state.ctrlPitch = clamp(pitch, -1, 1);
    },
    clearStick() { state.touching = false; state.ctrlBank = 0; state.ctrlPitch = 0; },
    placeOnRunway() { spawnForTakeoff(0, 0); },
    setView(chase) {
      state.viewChase = !!chase;
      el.hud.classList.toggle("chase", state.viewChase);
    },
    spawnAt(originIdx, dirIdx) { spawnForTakeoff(originIdx, dirIdx); },
    setVehicle(key) { applyVehicle(key); },
    skipScreens() {
      el.screenVehicle.classList.add("hiddenS");
      el.screenDir.classList.add("hiddenS");
    },
    teleportAirborne(distBehind, lateral, alt, headingDeg) {
      state.x = lateral;
      state.z = AIRPORTS[0].cz + Math.round(Math.cos(headingDeg * DEG)) * (TUNE.runwayLength / 2 + distBehind);
      state.y = AIRPORTS[0].elev + alt;
      state.heading = headingDeg * DEG;
      let bd = Infinity;
      state.destIdx = 0;
      for (let i = 0; i < AIRPORTS.length; i++) {
        const d = Math.abs(state.z - AIRPORTS[i].cz);
        if (d < bd) { bd = d; state.destIdx = i; }
      }
      state.originIdx = 1 - state.destIdx;
      placeRings();
      state.pitch = 0;
      state.bank = 0;
      state.speed = state.vp.cruiseSpeed;
      state.airVy = null;
      state.phase = "AIRBORNE";
      state.liftoffTimer = 0;
      state.climbAwayTimer = 0;
      state.celebrated = false;
      state.celebrateTimer = 0;
      state.approachLatch = false;
      state.canRotate = false;
    }
  }
};

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt <= 0) dt = 1 / 120;
  update(dt);
  if (!(window.__lp && window.__lp.noRender)) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
