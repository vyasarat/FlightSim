<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#79c8f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Little Pilot</title>
<style>
  :root { --veh: #e0483e; --veh2: #f2f4f7; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79c8f2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas#gl {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .pillar {
    position: absolute;
    top: -4vh;
    width: clamp(34px, 7vw, 92px);
    height: 62vh;
    background: linear-gradient(105deg, #2b3038 0%, #23282f 55%, #1a1e24 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.45);
  }
  #pillarL {
    left: calc(-2vw + env(safe-area-inset-left));
    transform: skewX(7deg);
    border-radius: 0 14px 26px 0;
  }
  #pillarR {
    right: calc(-2vw + env(safe-area-inset-right));
    transform: skewX(-7deg);
    border-radius: 0 0 14px 26px;
    transform: skewX(-7deg);
  }
  #brow {
    position: absolute;
    top: calc(-2vh + env(safe-area-inset-top));
    left: -2vw;
    right: -2vw;
    height: clamp(30px, 6.5vh, 74px);
    background: linear-gradient(180deg, #2b3038 0%, #23282f 70%, #1a1e24 100%);
    border-radius: 0 0 22px 22px;
    box-shadow: 0 6px 16px rgba(10,20,40,.35);
  }
  #accentLine {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 0 0 22px 22px;
  }
  #dash {
    position: absolute;
    left: -2vw;
    right: -2vw;
    bottom: calc(-2vh + env(safe-area-inset-bottom));
    height: clamp(96px, 19vh, 170px);
    background: linear-gradient(180deg, #333a44 0%, #23282f 18%, #1a1e24 100%);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 24px rgba(10,20,40,.35);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(18px, 5vw, 64px);
    padding-top: clamp(10px, 2.2vh, 24px);
  }
  #dash::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 26px 26px 0 0;
  }
  .dial {
    position: relative;
    width: clamp(76px, 15vmin, 128px);
    height: clamp(76px, 15vmin, 128px);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #2c323b 0%, #161a1f 62%);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.08);
    border: clamp(3px, 0.8vmin, 6px) solid #39404b;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(2.5px, 0.7vmin, 4.5px);
    height: 42%;
    background: #f2f4f7;
    border-radius: 3px;
    transform-origin: 50% 100%;
    translate: -50% -100%;
    will-change: transform;
  }
  .needle.red { background: #e0483e; height: 36%; width: clamp(3.5px, 1vmin, 6px); }
  .dial-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16%;
    height: 16%;
    background: #39404b;
    border-radius: 50%;
    translate: -50% -50%;
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(1.5px, 0.4vmin, 3px);
    height: 11%;
    background: #8b93a0;
    transform-origin: 50% 0;
  }
  #aiBall {
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(180deg, #79c8f2 0%, #a8dcf7 46%, #f4f8fa 48%, #f4f8fa 50%, #8a6f47 52%, #6f5738 100%);
    will-change: transform;
  }
  #aiHorizon {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: clamp(2px, 0.55vmin, 4px);
    background: #ffffff;
    opacity: .9;
  }
  #aiWings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58%;
    height: clamp(4px, 1.1vmin, 8px);
    translate: -50% -50%;
    z-index: 3;
  }
  #aiWings::before, #aiWings::after {
    content: "";
    position: absolute;
    top: 0;
    width: 44%;
    height: clamp(3px, 0.8vmin, 5px);
    background: #ffb43a;
    border-radius: 3px;
  }
  #aiWings::before { left: 0; }
  #aiWings::after { right: 0; }
  #aiWings span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(6px, 1.6vmin, 10px);
    height: clamp(6px, 1.6vmin, 10px);
    translate: -50% -50%;
    background: #ffb43a;
    border-radius: 50%;
  }
  #altDigits {
    position: absolute;
    left: 50%;
    bottom: 9%;
    translate: -50% 0;
    color: #e8ecf2;
    font-size: clamp(13px, 3.4vmin, 24px);
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  #rotateArrow {
    position: fixed;
    top: max(11vh, env(safe-area-inset-top) + 44px);
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #rotateArrow svg { width: clamp(72px, 14vmin, 130px); height: auto; display: block; }
  @keyframes blinkArrow {
    0%, 49% { opacity: 1; transform: translateY(0); }
    50%, 100% { opacity: 0.12; transform: translateY(10px); }
  }
  #rotateArrow.on { display: block; animation: blinkArrow .55s infinite; }
  #homeArrow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 7;
    pointer-events: none;
  }
  #homeArrow svg {
    display: none;
    width: var(--home-sz, 96px);
    height: var(--home-sz, 96px);
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.5));
  }
  #homeArrow.on svg {
    display: block;
    animation: homePulse 1.5s ease-in-out infinite;
  }
  @keyframes homePulse {
    0%, 100% { opacity: .82; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  #throttleBtn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    width: clamp(96px, 17vmin, 148px);
    height: clamp(96px, 17vmin, 148px);
    border-radius: 50%;
    border: clamp(4px, 1vmin, 7px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 10px 26px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    z-index: 10;
    touch-action: none;
    padding: 0;
    outline: none;
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #throttleBtn svg { width: 52%; height: 52%; }
  #throttleBtn.pressed {
    transform: scale(.93);
    box-shadow: 0 4px 12px rgba(10,20,40,.4), inset 0 3px 10px rgba(0,0,0,.5);
  }
  #throttleBtn.hidden { display: none; }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }
  .screen {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 30%, rgba(36,44,56,.97), rgba(14,17,22,.98));
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: clamp(16px, 3vmin, 34px);
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-y: auto;
  }
  .screen.hiddenS { display: none; }
  .card {
    width: clamp(150px, 23vmin, 225px);
    height: clamp(110px, 16vmin, 158px);
    border-radius: 22px;
    background: linear-gradient(165deg, #2e3540 0%, #191d23 100%);
    border: clamp(4px, 0.9vmin, 7px) solid #39404b;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none; touch-action: manipulation;
    transition: transform .08s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .card:active { transform: scale(.94); }
  .card.sel { border-color: var(--veh); }
  .card svg { width: 84%; height: 84%; }
  .dirCard {
    width: clamp(180px, 30vmin, 270px);
    height: clamp(140px, 23vmin, 215px);
  }
</style>
</head>

const DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function wrapPi(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function hash2(ix, iz) {
  let n = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = (n ^ (n >>> 16)) >>> 0;
  return n / 4294967295;
}

function hashSalt(ix, iz, salt) {
  return hash2(ix + salt * 7919, iz - salt * 104729);
}

let seed = 987654321;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz);
  const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

function rawHeight(x, z) {
  return valueNoise(x / TUNE.hillWavelength, z / TUNE.hillWavelength) * TUNE.hillAmplitude
       + valueNoise(x / TUNE.midWavelength + 37.2, z / TUNE.midWavelength + 91.7) * TUNE.midAmplitude
       + valueNoise(x / TUNE.microWavelength + 512.1, z / TUNE.microWavelength + 77.3) * TUNE.microAmplitude
       - TUNE.hillAmplitude * 0.5;
}

function flattenMask(x, z) {
  const nx = Math.max(Math.abs(x) - TUNE.runwayWidth * 0.5 - 40, 0) / TUNE.flattenMargin;
  const nz = Math.max(Math.abs(z) - TUNE.runwayLength * 0.5 - 60, 0) / TUNE.flattenMargin;
  return 1 - smoothstep(0, 1, Math.max(nx, nz));
}

const RWY_ELEV = Math.max(rawHeight(0, 0), TUNE.waterLevel + 2);

function terrainEff(x, z) {
  const m = flattenMask(x, z);
  return rawHeight(x, z) * (1 - m) + RWY_ELEV * m;
}

const cLow = new THREE.Color(TUNE.colorLow);
const cMid = new THREE.Color(TUNE.colorMid);
const cHigh = new THREE.Color(TUNE.colorHigh);
const cSand = new THREE.Color(TUNE.sandColor);
const tmpColor = new THREE.Color();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  flatShading: true,
  roughness: 1.0,
  metalness: 0.0
});

function buildChunk(cx, cz) {
  const cs = TUNE.chunkSize;
  const geo = new THREE.PlaneGeometry(cs, cs, TUNE.chunkSegments, TUNE.chunkSegments);
  geo.rotateX(-Math.PI / 2);
  const ox = cx * cs, oz = cz * cs;
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, terrainEff(pos.getX(i) + ox, pos.getZ(i) + oz));
  }

  const flat = geo.toNonIndexed();
  geo.dispose();
  const fp = flat.attributes.position;
  const colors = new Float32Array(fp.count * 3);
  const hSpan = TUNE.colorHighHeight - TUNE.colorLowHeight;
  const shoreLo = TUNE.waterLevel - 1.2;
  const shoreHi = TUNE.waterLevel + 1.4;
  for (let f = 0; f < fp.count; f += 3) {
    const hy = (fp.getY(f) + fp.getY(f + 1) + fp.getY(f + 2)) / 3;
    if (hy < shoreHi) {
      tmpColor.copy(cSand).multiplyScalar(hy < shoreLo ? 0.78 : lerp(0.85, 1.02, smoothstep(shoreLo, shoreHi, hy)));
    } else {
      const t = clamp((hy - TUNE.colorLowHeight) / hSpan, 0, 1);
      if (t < 0.5) tmpColor.copy(cLow).lerp(cMid, t * 2);
      else tmpColor.copy(cMid).lerp(cHigh, (t - 0.5) * 2);
    }
    const j = 1 + (hash2(Math.round(fp.getX(f)), Math.round(fp.getZ(f))) - 0.5) * 2 * TUNE.colorJitter;
    for (let v = 0; v < 3; v++) {
      colors[(f + v) * 3] = tmpColor.r * j;
      colors[(f + v) * 3 + 1] = tmpColor.g * j;
      colors[(f + v) * 3 + 2] = tmpColor.b * j;
    }
  }
  flat.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  flat.computeVertexNormals();

  const mesh = new THREE.Mesh(flat, terrainMat);
  mesh.position.set(ox, 0, oz);
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  return mesh;
}

const chunks = new Map();
let lastCellX = null, lastCellZ = null;

function updateChunks(px, pz) {
  const cs = TUNE.chunkSize;
  const ccx = Math.round(px / cs), ccz = Math.round(pz / cs);
  if (ccx === lastCellX && ccz === lastCellZ) return;
  lastCellX = ccx;
  lastCellZ = ccz;

  const need = new Set();
  for (let dx = -TUNE.chunkRadius; dx <= TUNE.chunkRadius; dx++) {
    for (let dz = -TUNE.chunkRadius; dz <= TUNE.chunkRadius; dz++) {
      const k = (ccx + dx) + "," + (ccz + dz);
      need.add(k);
      if (!chunks.has(k)) {
        const m = buildChunk(ccx + dx, ccz + dz);
        chunks.set(k, m);
        scene.add(m);
      }
    }
  }
  for (const [k, m] of chunks) {
    if (!need.has(k)) {
      scene.remove(m);
      m.geometry.dispose();
      chunks.delete(k);
    }
  }
}

function makeCloud() {
  const g = new THREE.Group();
  const puffs = 3 + Math.floor(rnd() * 3);
  for (let i = 0; i < puffs; i++) {
    const r = 18 + rnd() * 26;
    const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), cloudMat);
    puff.position.set((rnd() - 0.5) * 70, (rnd() - 0.5) * 14, (rnd() - 0.5) * 50);
    puff.scale.y = 0.55;
    g.add(puff);
  }
  return g;
}

function respawnCloud(c, px, py, pz, hx, hz, ahead) {
  const d = TUNE.cloudRespawnAhead[0] + rnd() * (TUNE.cloudRespawnAhead[1] - TUNE.cloudRespawnAhead[0]);
  const lat = (rnd() - 0.5) * 2 * TUNE.cloudLateralSpread;
  const base = ahead ? d : rnd() * TUNE.fogFar;
  c.position.set(
    px + hx * base - hz * lat,
    TUNE.cloudAltitudeMin + rnd() * (TUNE.cloudAltitudeMax - TUNE.cloudAltitudeMin),
    pz + hz * base + hx * lat
  );
}

function inCorridor(x, z, extra) {

const landmarkCells = new Map();
const blinkers = [];
const dummyObj = new THREE.Object3D();

function placeLandmark(cellX, cellZ) {
  const cxw = cellX * TUNE.landmarkGrid, czw = cellZ * TUNE.landmarkGrid;
  const isTower = hashSalt(cellX, cellZ, 91) < 0.5;
  let lx = cxw + (hashSalt(cellX, cellZ, 92) - 0.5) * TUNE.landmarkGrid * 0.5;
  let lz = czw + (hashSalt(cellX, cellZ, 93) - 0.5) * TUNE.landmarkGrid * 0.5;
  if (Math.abs(lx) < 1700 && Math.abs(lz) < 1700) return null;
  if (inCorridor(lx, lz, 200)) return null;
  const proto = isTower ? towerProto : bridgeProto;
  const inst = proto.clone();
  if (isTower) {
    const gy = terrainEff(lx, lz);
    if (gy < TUNE.waterLevel + 1) return null;
    inst.position.set(lx, gy, lz);
    if (inst.userData.blinker) blinkers.push(inst.userData.blinker);
  } else {
    let deckY = TUNE.waterLevel + 15;
    let overWater = true;
    for (let s = -1; s <= 1; s += 0.5) {
      if (terrainEff(lx + s * 140, lz) > TUNE.waterLevel + 2.5) overWater = false;
    }
    if (!overWater) deckY = terrainEff(lx, lz) + 15;
    inst.position.set(lx, deckY, lz);
    inst.rotation.y = (hashSalt(cellX, cellZ, 94) < 0.5 ? 0 : Math.PI / 2);
  }
  scene.add(inst);
  return inst;
}

function syncLandmarks(px, pz) {
  const grid = TUNE.landmarkGrid;
  const ccx = Math.round(px / grid), ccz = Math.round(pz / grid);
  const R = Math.ceil((TUNE.sceneryRadius + 400) / grid);
  const need = new Set();
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      const cx = ccx + dx, cz = ccz + dz;
      const k = cx + "," + cz;
      if (hashSalt(cx, cz, 90) >= TUNE.landmarkChance) continue;
      need.add(k);
      if (!landmarkCells.has(k)) {
        const inst = placeLandmark(cx, cz);
        landmarkCells.set(k, inst);
      } else if (landmarkCells.get(k) === null) {
        landmarkCells.set(k, placeLandmark(cx, cz));
      }
    }
  }
  for (const [k, inst] of landmarkCells) {
    if (!need.has(k)) {
      if (inst) {
        scene.remove(inst);
        const bi = blinkers.indexOf(inst.userData.blinker);
        if (bi >= 0) blinkers.splice(bi, 1);
      }
      landmarkCells.delete(k);
    }
  }
}

function rebuildTrees(px, pz) {
  const cs = TUNE.treeCell;
  const R = Math.ceil(TUNE.sceneryRadius / cs);
  const ccx = Math.round(px / cs), ccz = Math.round(pz / cs);
  let ti = 0;
  outer:
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      const cx = ccx + dx, cz = ccz + dz;
      if (hashSalt(cx, cz, 41) >= TUNE.treeDensity) continue;
      const n = 1 + Math.floor(hashSalt(cx, cz, 42) * TUNE.treeMaxPerCell);
      for (let k = 0; k < n; k++) {
        if (ti >= TUNE.treeMaxInstances) break outer;
        const wx = (cx + hashSalt(cx * 5 + k, cz, 43)) * cs;
        const wz = (cz + hashSalt(cx, cz * 5 + k, 44)) * cs;
        if (flattenMask(wx, wz) > 0.02) continue;
        if (inCorridor(wx, wz, -80)) continue;
        const gy = terrainEff(wx, wz);
        if (gy < TUNE.waterLevel + 1.6) continue;
        const s = 0.8 + hashSalt(cx + k, cz - k, 45) * 0.9;
        dummyObj.position.set(wx, gy - 0.3, wz);
        dummyObj.rotation.set(0, hashSalt(cx, cz, 46) * Math.PI * 2, 0);
        dummyObj.scale.set(s, s * (0.9 + hashSalt(cx, cz, 47) * 0.5), s);
        dummyObj.updateMatrix();
        trunkInst.setMatrixAt(ti, dummyObj.matrix);
        canopyInst.setMatrixAt(ti, dummyObj.matrix);
        tmpColor.setHex(TUNE.treeCanopyColor).multiplyScalar(0.82 + hashSalt(cx - k, cz + k, 48) * 0.4);
        canopyInst.setColorAt(ti, tmpColor);
        ti++;
      }
    }
  }
  trunkInst.count = ti;
  canopyInst.count = ti;
  trunkInst.instanceMatrix.needsUpdate = true;
  canopyInst.instanceMatrix.needsUpdate = true;
  if (canopyInst.instanceColor) canopyInst.instanceColor.needsUpdate = true;
}

function rebuildBuildings(px, pz) {
  const grid = TUNE.townGrid;
  const R = Math.ceil(TUNE.sceneryRadius / grid);
  const ccx = Math.round(px / grid), ccz = Math.round(pz / grid);
  let bi = 0;
  buildingBoxes.length = 0;
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      if (bi >= TUNE.buildingMaxInstances) break;
      const cx = ccx + dx, cz = ccz + dz;
      if (hashSalt(cx, cz, 61) >= TUNE.townChance) continue;
      const tcx = (cx + 0.5 + (hashSalt(cx, cz, 62) - 0.5) * 0.6) * grid;
      const tcz = (cz + 0.5 + (hashSalt(cx, cz, 63) - 0.5) * 0.6) * grid;
      if (inCorridor(tcx, tcz, -60)) continue;
      const n = TUNE.townBuildingsMin + Math.floor(hashSalt(cx, cz, 64) * (TUNE.townBuildingsMax - TUNE.townBuildingsMin + 1));
      for (let k = 0; k < n; k++) {
        if (bi >= TUNE.buildingMaxInstances) break;
        const ang = hashSalt(cx * 7 + k, cz, 65) * Math.PI * 2;
        const rad = (0.25 + hashSalt(cx * 7 + k, cz * 7 + k, 66) * 0.75) * grid * 0.33;
        const wx = tcx + Math.cos(ang) * rad;
        const wz = tcz + Math.sin(ang) * rad;
        if (flattenMask(wx, wz) > 0.02 || inCorridor(wx, wz, -40)) continue;
        const gy = terrainEff(wx, wz);
        if (gy < TUNE.waterLevel + 1.8) continue;
        const w = 8 + hashSalt(cx + k, cz, 67) * 14;
        const d = 8 + hashSalt(cx, cz + k, 68) * 14;
        const hgt = 6 + hashSalt(cx + k, cz - k, 69) * 20;
        dummyObj.position.set(wx, gy - 0.3, wz);
        dummyObj.rotation.set(0, Math.round(hashSalt(cx, cz, 70) * 4) * Math.PI / 2 + (hashSalt(cx, cz, 71) - 0.5) * 0.2, 0);
        dummyObj.scale.set(w, hgt, d);
        dummyObj.updateMatrix();
        buildingInst.setMatrixAt(bi, dummyObj.matrix);
        tmpColor.setHex(BUILDING_PALETTE[Math.floor(hashSalt(cx + k, cz + k, 72) * BUILDING_PALETTE.length)]);
        buildingInst.setColorAt(bi, tmpColor);
        buildingBoxes.push({ x: wx, z: wz, hw: w / 2, hd: d / 2, top: gy - 0.3 + hgt });
        bi++;
      }
    }
  }
  buildingInst.count = bi;
  buildingInst.instanceMatrix.needsUpdate = true;
  if (buildingInst.instanceColor) buildingInst.instanceColor.needsUpdate = true;
}

let scenCenterX = null, scenCenterZ = null;
function updateScenery(px, pz, force) {
  if (!force && scenCenterX !== null) {
    const dx = px - scenCenterX, dz = pz - scenCenterZ;
    if (dx * dx + dz * dz < TUNE.sceneryRebuildDist * TUNE.sceneryRebuildDist) return;
  }
  scenCenterX = px;
  scenCenterZ = pz;
  rebuildTrees(px, pz);
  rebuildBuildings(px, pz);
  syncLandmarks(px, pz);
}

let audioCtx = null;
let masterGain = null;
let engineNodes = null;

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) {
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  startEngine();
}

function startEngine() {
  if (engineNodes || !audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = "sawtooth";
  o.frequency.value = TUNE.engineFreqIdle;
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = TUNE.engineFilterFreq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(TUNE.engineGainIdle, t + 0.8);
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = TUNE.engineLfoRate;
  const lfoG = audioCtx.createGain();
  lfoG.gain.value = TUNE.engineGainIdle * 0.25;
  lfo.connect(lfoG);
  lfoG.connect(g.gain);
  o.connect(lp);
  lp.connect(g);
  g.connect(masterGain);
  o.start(t);
  lfo.start(t);
  engineNodes = { o, lfo, g };
}

let lastEngineNorm = 1;
function setEngine(speedNorm) {
  lastEngineNorm = speedNorm;
  if (!engineNodes || !audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;
  const off = speedNorm <= 0.02;
  const gainTarget = off ? 0.0004 : lerp(TUNE.engineGainIdle, TUNE.engineGainMax, speedNorm);
  const freqTarget = off ? TUNE.engineFreqIdle * 0.55 : lerp(TUNE.engineFreqIdle, TUNE.engineFreqMax, speedNorm);
  engineNodes.o.frequency.setTargetAtTime(freqTarget, t, 0.18);
  engineNodes.g.gain.setTargetAtTime(gainTarget, t, 0.22);
}

function synthBlip(type, f0, f1, dur, peak, when) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(masterGain);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function noiseBurst(dur, freq, peak, when) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime + (when || 0);
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = freq;
  bp.Q.value = 0.9;
  const g = audioCtx.createGain();
  g.gain.value = peak;
  src.connect(bp);
  bp.connect(g);
  g.connect(masterGain);
  src.start(t);
}

function confettiBurst() {

function updateFx(dt) {
  if (!confetti.length) {
    fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    return;
  }
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const next = [];
  for (const p of confetti) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 210 * dt;
    p.rot += p.vr * dt;
    if (p.life > 0 && p.y < window.innerHeight + 40) {
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      fxCtx.restore();
      next.push(p);
    }
  }

}

const parts = [];
const FIRE_COLS = [0xff9a2a, 0xffd23e, 0xff6a1a];
const SMOKE_COL = 0x565b63;
const METAL_COL = 0x3a3f46;
for (let i = 0; i < TUNE.debrisCount; i++) {
  parts.push({ alive: false, kind: i % 3, life: 0, maxLife: 1, size: 1,
    px: 0, py: 0, pz: 0, vx: 0, vy: 0, vz: 0,

const fireballs = [];
for (let i = 0; i < 5; i++) {
  const fb = new THREE.Mesh(
    new THREE.SphereGeometry(1, 10, 8),

  );

let shakeAmp = 0;

function triggerExplosion(nx, ny, nz, intensity) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.alive = true;
    p.kind = i % 3;
    p.maxLife = (p.kind === 1 ? 1.9 : 1.3) + rnd() * 0.7;
    p.life = p.maxLife;
    const sp = (16 + rnd() * 34) * (0.7 + intensity * 0.5);
    const th = rnd() * Math.PI * 2;
    const up = p.kind === 1 ? 0.6 + rnd() * 0.5 : rnd() * 1.2 - 0.15;
    const side = Math.sqrt(Math.max(0, 1 - up * up));
    p.px = nx; p.py = ny; p.pz = nz;
    p.vx = Math.cos(th) * side * sp;
    p.vz = Math.sin(th) * side * sp;
    p.vy = Math.abs(up) * sp;
    p.rx = rnd() * Math.PI; p.ry = rnd() * Math.PI;
    p.rvx = (rnd() - 0.5) * 9; p.rvy = (rnd() - 0.5) * 9;
    p.size = p.kind === 1 ? 1.6 + rnd() * 1.6 : 0.7 + rnd() * 1.3;
  }
  for (const fb of fireballs) {
    fb.visible = true;
    fb.position.set(nx, ny + 2, nz);
    fb.position.x += (rnd() - 0.5) * 8;
    fb.userData.t = 0;
    fb.userData.dur = 0.5 + rnd() * 0.25;
  }
  debrisMesh.visible = true;
  shakeAmp = 1;
  boomSound();
  flags.exploded++;
}

function updateExplosion(dt, homePos, seeking) {
  let anyAlive = false;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p.alive || p.life <= 0) {
      if (p.alive) p.alive = false;
      dummyObj.position.set(0, -9999, 0);
      dummyObj.scale.setScalar(0.001);
      dummyObj.rotation.set(0, 0, 0);
      dummyObj.updateMatrix();
      debrisMesh.setMatrixAt(i, dummyObj.matrix);
      continue;
    }
    anyAlive = true;
    p.life -= dt;
    if (seeking && p.life < 0.55) {
      p.px += (homePos.x - p.px) * Math.min(1, 9 * dt);
      p.py += (homePos.y - p.py) * Math.min(1, 9 * dt);
      p.pz += (homePos.z - p.pz) * Math.min(1, 9 * dt);
    } else {
      const grav = p.kind === 2 ? -30 : (p.kind === 1 ? 5 : -9);
      p.vy += grav * dt;
      p.vx *= 1 - Math.min(1, 1.1 * dt);
      p.vz *= 1 - Math.min(1, 1.1 * dt);
      p.px += p.vx * dt; p.py += p.vy * dt; p.pz += p.vz * dt;
    }
    p.rx += p.rvx * dt; p.ry += p.rvy * dt;
    const fade = clamp(p.life / 0.4, 0, 1);
    dummyObj.position.set(p.px, p.py, p.pz);
    dummyObj.rotation.set(p.rx, p.ry, 0);
    dummyObj.scale.setScalar(Math.max(0.01, p.size * (p.kind === 1 ? (2 - p.life / p.maxLife) : fade)));
    dummyObj.updateMatrix();
    debrisMesh.setMatrixAt(i, dummyObj.matrix);
    tmpColor.setHex(p.kind === 0 ? FIRE_COLS[i % FIRE_COLS.length] : (p.kind === 1 ? SMOKE_COL : METAL_COL));
    debrisMesh.setColorAt(i, tmpColor);
  }
  debrisMesh.instanceMatrix.needsUpdate = true;
  if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;
  if (!anyAlive && !seeking) debrisMesh.visible = false;
  for (const fb of fireballs) {
    if (!fb.visible) continue;
    fb.userData.t += dt;
    const tt = fb.userData.t / fb.userData.dur;
    if (tt >= 1) { fb.visible = false; fb.material.opacity = 0; continue; }
    fb.scale.setScalar(3 + tt * 16);
    fb.material.opacity = 0.9 * (1 - tt);
  }
}

const forward = new THREE.Vector3();

function groundPhase(dt) {
  const grounded = state.phase === "TAXI" || state.phase === "ROLL";
  if (!grounded) return;
  const sgn = state.dirIdx === 0 ? 1 : -1;
  state.x = 0;
  state.pitch += (0 - state.pitch) * Math.min(1, 8 * dt);
  state.bank += (0 - state.bank) * Math.min(1, 8 * dt);
  state.heading = state.dirIdx === 0 ? 0 : Math.PI;
  state.y = RWY_ELEV + TUNE.gearHeight;
  state.airVy = null;

  if (state.phase === "TAXI") {
    state.speed = 0;
    if (state.throttleHeld) state.phase = "ROLL";
    return;
  }

  if (state.throttleHeld) {
    state.speed = Math.min(state.speed + state.vp.accel * dt, state.vp.cruiseSpeed * 1.15);
  } else {
    state.speed = Math.max(state.speed - TUNE.brakeDecel * dt, 0);
  }

  state.z -= sgn * state.speed * dt;

  if (state.speed >= TUNE.rotateSpeed) {
    state.canRotate = true;
  }
  if (state.canRotate && state.ctrlPitch > TUNE.rotateStickThreshold) {
    state.rotatePullTime += dt;
    if (state.rotatePullTime >= TUNE.rotateStickTime) {
      state.phase = "AIRBORNE";
      state.liftoffTimer = TUNE.liftoffHoldTime;
      state.pitch = TUNE.liftoffPitchDeg * 0.5;
      gearSound();
      flags.liftoff++;
    }
  } else {
    state.rotatePullTime = 0;
  }

  const pastEnd = sgn * state.z < -(TUNE.runwayLength / 2) - 40;
  if (pastEnd || (!state.throttleHeld && state.speed <= 0.01)) {
    if (pastEnd) {
      state.speed = Math.max(state.speed - TUNE.brakeDecel * 2 * dt, 0);
      if (state.speed <= 0.01) repositionToStart();
    } else {
      state.phase = "TAXI";
    }
  }
}

function updateAssists(dt) {
  const thz = TUNE.runwayLength / 2;
  const dxr = state.x - 0;
  const dzr = state.z - thz;
  const distHoriz = Math.sqrt(dxr * dxr + dzr * dzr);

  const t = Math.abs(wrapPi(state.heading)) < Math.PI / 2 ? 0 : Math.PI;
  const ft = { x: -Math.sin(t), z: -Math.cos(t) };
  const rt = { x: Math.cos(t), z: -Math.sin(t) };
  const along = dxr * ft.x + dzr * ft.z;
  const lat = dxr * rt.x + dzr * rt.z;
  state.approachData = { t, along, lat };

  const dot = (-Math.sin(state.heading) * -dxr + -Math.cos(state.heading) * -dzr) / (distHoriz || 1);
  state.engaged = state.phase === "AIRBORNE"
    && state.liftoffTimer <= 0
    && distHoriz < TUNE.approachEngageDist
    && dot > 0.25;

  if (!state.engaged) {
    state.assistBias *= Math.max(0, 1 - 2.5 * dt);
    return;
  }

  state.approachLatch = true;

  const err = wrapPi(t - state.heading);
  const falloff = 1 - smoothstep(TUNE.alignStartDist * 0.5, TUNE.approachEngageDist, distHoriz);

  const dH = clamp(err * TUNE.alignHeadingGain, -TUNE.alignHeadingMaxRateDeg * DEG, TUNE.alignHeadingMaxRateDeg * DEG);
  state.heading += dH * falloff * dt;

  const biasTarget = -clamp(lat * TUNE.alignLateralGain, -TUNE.alignRollMaxBiasDeg, TUNE.alignRollMaxBiasDeg) * falloff;
  state.assistBias += (biasTarget - state.assistBias) * Math.min(1, 2 * dt);
}

function update(dt) {
  if (state.exploding) {
    state.explodeTimer -= dt;
    const seeking = state.explodeTimer <= 0.5;
    updateExplosion(dt, safePos, seeking);
    shakeAmp = Math.max(0, shakeAmp - dt * 0.9);
    setEngine(0.01);
    updateChunks(state.x, state.z);
    skyDome.position.set(state.x, state.y, state.z);
    waterMesh.position.set(state.x, TUNE.waterLevel, state.z);
    camera.position.set(
      state.x + (Math.random() - 0.5) * 11 * shakeAmp,
      state.y + (Math.random() - 0.5) * 9 * shakeAmp,
      state.z + (Math.random() - 0.5) * 11 * shakeAmp
    );
    camera.rotation.set(state.pitch * DEG, state.heading, -state.bank * DEG);
    updateHud();
    updateFx(dt);
    if (state.explodeTimer <= 0) {
      state.exploding = false;
      state.x = safePos.x;
      state.y = safePos.y;
      state.z = safePos.z;
      state.speed = state.vp.cruiseSpeed * 0.6;
      state.pitch = 0;
      state.bank = 0;
      state.airVy = null;
      state.bounceTimer = 0;
      state.canRotate = false;
      state.approachLatch = false;
      whoosh();
    }
    return;
  }
  let targetBank = 0, targetPitch = 0;
  if (state.touching) {
    targetBank = state.ctrlBank * state.vp.bankLimitDeg;
    targetPitch = state.ctrlPitch * state.vp.pitchLimitDeg;
  }

  if (state.phase === "TAXI" || state.phase === "ROLL") {
    groundPhase(dt);
    setEngine(state.speed / state.vp.cruiseSpeed);
    el.throttleBtn.classList.remove("hidden");
    el.rotateArrow.classList.toggle("on",
      state.phase === "ROLL" && state.canRotate);
  } else {
    el.throttleBtn.classList.add("hidden");
    el.rotateArrow.classList.remove("on");

    let resp = state.touching ? TUNE.controlResponse : TUNE.autoLevelResponse;
    let turnCoupling = true;

    if (state.phase === "CLIMB_AWAY") {
      state.climbAwayTimer -= dt;
      targetPitch = TUNE.climbAwayPitchDeg;
      targetBank = 0;
      resp = TUNE.controlResponse;
      state.assistBias *= Math.max(0, 1 - 3 * dt);
      state.speed += (state.vp.cruiseSpeed - state.speed) * Math.min(1, 1.2 * dt);
      if (state.climbAwayTimer <= 0) {
        state.phase = "AIRBORNE";
        flags.missed++;
      }
    } else if (state.phase === "LANDED") {
      state.speed = Math.max(state.speed - TUNE.brakeDecel * 0.55 * dt, 0);
      targetPitch = 0;
      targetBank = 0;
      resp = 4;
      turnCoupling = false;
      state.assistBias = 0;
      const adR = state.approachData;
      if (adR && Math.abs(adR.along) < TUNE.runwayLength) {
        state.heading += wrapPi(adR.t - state.heading) * Math.min(1, 1.5 * dt);
      }
      if (state.speed <= 0.05 && !state.celebrated) {
        state.celebrated = true;
        confettiBurst();
        cheer();
        state.celebrateTimer = 2.6;
      }
      if (state.celebrated) {
        state.celebrateTimer -= dt;
        if (state.celebrateTimer <= 0) repositionToStart();
      }
    } else {
      updateAssists(dt);
      if (state.liftoffTimer > 0) {
        state.liftoffTimer -= dt;
        targetPitch = TUNE.liftoffPitchDeg;
      }
      if (state.engaged) {
        targetBank += state.assistBias;
      }
      targetBank = clamp(targetBank, -state.vp.bankLimitDeg, state.vp.bankLimitDeg);
      targetPitch = clamp(targetPitch, -state.vp.pitchLimitDeg, state.vp.pitchLimitDeg);
      const hover = state.vp.hoverSpeed > 0 && !state.touching;
      const targetSpeed = hover ? state.vp.hoverSpeed : (state.engaged ? TUNE.approachSpeed : state.vp.cruiseSpeed);
      state.speed += (targetSpeed - state.speed) * Math.min(1, (hover ? 0.5 : TUNE.autoThrottleResponse) * dt);
    }

    const k = Math.min(1, resp * dt);
    state.bank += (targetBank - state.bank) * k;
    state.pitch += (targetPitch - state.pitch) * k;

    const effBank = clamp(state.bank + state.assistBias, -state.vp.bankLimitDeg, state.vp.bankLimitDeg);
    if (turnCoupling) {
      state.heading -= state.vp.turnRateDeg * DEG * (effBank / state.vp.bankLimitDeg) * dt;
    }

    const pr = state.pitch * DEG;
    const hr = state.heading;
    const cp = Math.cos(pr);
    forward.set(-Math.sin(hr) * cp, Math.sin(pr), -Math.cos(hr) * cp);
    state.x += forward.x * state.speed * dt;
    state.z += forward.z * state.speed * dt;
    state.y += forward.y * state.speed * dt;

    setEngine(state.speed / state.vp.cruiseSpeed);

    const groundNow = terrainEff(state.x, state.z);
    let contactGround = Math.max(groundNow, TUNE.waterLevel);
    if (groundNow > TUNE.waterLevel + 0.01) contactGround = groundNow;
    for (let i = 0; i < buildingBoxes.length; i++) {
      const bb = buildingBoxes[i];
      if (Math.abs(state.x - bb.x) < bb.hw + 2 && Math.abs(state.z - bb.z) < bb.hd + 2) {
        if (state.y < bb.top + 4) contactGround = Math.max(contactGround, bb.top);
      }
    }

    if (state.phase === "LANDED") {
      state.y = groundNow + TUNE.gearHeight;
    } else {
      const agl = state.y - groundNow;
      const halfW = TUNE.runwayWidth / 2;
      const halfL = TUNE.runwayLength / 2;
      const ad = state.approachData || { t: 0, along: 1e9, lat: 1e9 };
      const withinLat = Math.abs(ad.lat) <= halfW * TUNE.touchdownLatTolMult;
      const overRect = ad.along > -40 && ad.along < halfL && withinLat;

      if (state.phase === "AIRBORNE" && overRect && agl <= TUNE.touchdownClearance) {
        if (Math.abs(wrapPi(state.heading - ad.t)) <= TUNE.touchdownHeadingTolDeg * DEG) {
          state.phase = "LANDED";
          flags.touchdown++;
          chirp();
          state.y = groundNow + TUNE.gearHeight;
        } else {
          state.approachLatch = false;
          state.phase = "CLIMB_AWAY";
          state.climbAwayTimer = TUNE.climbAwayTime;
        }
      } else if (
        state.phase === "AIRBORNE" && state.approachLatch && agl < 45 &&
        (ad.along > halfL + 40 || (ad.along > 60 && !withinLat))
      ) {
        state.approachLatch = false;
        state.phase = "CLIMB_AWAY";
        state.climbAwayTimer = TUNE.climbAwayTime;
      } else if (agl <= TUNE.terrainClearance && !(
        Math.abs(state.x) <= halfW + 12 && Math.abs(state.z) <= halfL + 12
      )) {
        const descent = -(Math.sin(state.pitch * DEG) * state.speed);
        const steep =
          descent > TUNE.explodeDescentRate ||
          Math.abs(state.pitch) > TUNE.explodeAngleDeg ||
          state.speed > state.vp.cruiseSpeed * 1.4;
        if (steep) {
          state.exploding = true;
          state.explodeTimer = TUNE.reassembleDelay;
          safePos.x = state.x;
          safePos.z = state.z;
          safePos.y = Math.max(groundNow, TUNE.waterLevel) + 60;
          triggerExplosion(state.x, Math.max(state.y - 2, contactGround + 1), state.z, clamp(state.speed / 80, 0, 1));
        } else {
          state.y = contactGround + TUNE.terrainClearance;
          if (state.bounceTimer <= 0) {
            state.airVy = TUNE.bounceImpulse;
            state.bounceTimer = TUNE.bounceHoldTime;
            boing();
            flags.bounced++;
          }
        }
      }

      if (state.airVy !== null) {
        state.airVy -= TUNE.bounceGravity * dt;
        state.y += state.airVy * dt;
        const gnd = terrainEff(state.x, state.z);
        if (state.airVy <= Math.sin(state.pitch * DEG) * state.speed && state.y > gnd) {
          state.airVy = null;
        } else if (state.y <= gnd) {
          state.y = gnd;
        }
      }
      if (state.phase === "AIRBORNE" || state.phase === "CLIMB_AWAY") {
        const floorNow = Math.max(terrainEff(state.x, state.z), TUNE.waterLevel);
        if (state.y < floorNow + 0.6) {
          state.y = floorNow + 0.6;
          if (state.airVy !== null && state.airVy < 0) state.airVy = null;
        }
      }
      state.bounceTimer = Math.max(0, state.bounceTimer - dt);
    }
  }

  updateChunks(state.x, state.z);
  updateScenery(state.x, state.z, false);
  skyDome.position.set(state.x, state.y, state.z);
  waterMesh.position.set(state.x, TUNE.waterLevel, state.z);

  const hx = -Math.sin(state.heading), hz = -Math.cos(state.heading);
  for (const c of clouds) {
    const dx = c.position.x - state.x, dz = c.position.z - state.z;
    if (dx * dx + dz * dz > TUNE.fogFar * TUNE.fogFar * 1.44) {
      respawnCloud(c, state.x, state.y, state.z, hx, hz, true);
    }
  }

  const pulse = 1 + Math.sin(performance.now() * 0.001 * TUNE.ringPulseRate) * 0.07;
  for (const r of rings) r.scale.setScalar(pulse);
  const blinkOn = Math.sin(performance.now() * 0.004) > -0.3;
  for (const b of blinkers) b.visible = blinkOn;

  camera.position.set(
    state.x + (Math.random() - 0.5) * 11 * shakeAmp,
    state.y + (Math.random() - 0.5) * 9 * shakeAmp,
    state.z + (Math.random() - 0.5) * 11 * shakeAmp
  );
  camera.rotation.set(state.pitch * DEG, state.heading, -state.bank * DEG);
  shakeAmp = Math.max(0, shakeAmp - dt * 0.9);

  updateHud();
  updateFx(dt);
  updateExplosion(dt, safePos, false);
}

function updateHomeArrow() {
  if (state.phase !== "AIRBORNE" && state.phase !== "CLIMB_AWAY") {
    el.homeArrow.classList.remove("on");
    return;
  }
  const thz = TUNE.runwayLength / 2;
  const rx = -state.x, rz = thz - state.z;
  const dist = Math.sqrt(rx * rx + rz * rz);
  if (dist <= TUNE.homeIndicatorDistance) {
    el.homeArrow.classList.remove("on");
    return;
  }
  el.homeArrow.classList.add("on");

  const fx = -Math.sin(state.heading), fz = -Math.cos(state.heading);
  const dot = fx * rx + fz * rz;
  const cross = fx * rz - fz * rx;
  const theta = Math.atan2(cross, dot);

  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const radius = Math.min(cx, cy) - TUNE.homeIndicatorSize * 0.75 - 10;
  const px = cx + Math.sin(theta) * radius;
  const py = cy - Math.cos(theta) * radius;
  el.homeArrow.style.left = px + "px";
  el.homeArrow.style.top = py + "px";
  el.homeArrow.style.transform = `translate(-50%,-50%) rotate(${theta * 180 / Math.PI}deg)`;
}

function updateHud() {
  const asiFrac = clamp(state.speed / TUNE.asiMaxSpeed, 0, 1);
  el.asiNeedle.style.transform = `rotate(${-120 + asiFrac * 240}deg)`;
  const altM = Math.max(0, state.y - Math.max(terrainEff(state.x, state.z), TUNE.waterLevel));
  const altFrac = clamp(altM / TUNE.altMaxMeters, 0, 1);
  el.altNeedle.style.transform = `rotate(${-120 + altFrac * 240}deg)`;
  el.altDigits.textContent = String(Math.round(altM));
  el.aiBall.style.transform = `rotate(${-state.bank}deg) translateY(${clamp(state.pitch, -40, 40) * TUNE.hudPitchPixelsPerDeg}px)`;
  updateHomeArrow();
}

updateChunks(state.x, state.z);
updateScenery(state.x, state.z, true);
for (const c of clouds) respawnCloud(c, state.x, state.y, state.z, 0, -1, false);
grabWakeLock();

window.__lp = {
  TUNE, state, flags, update, terrainEff,
  get engineNorm() { return lastEngineNorm; },
  api: {
    setThrottle(v) { state.throttleHeld = !!v; },
    setStick(bank, pitch) {
      state.touching = true;
      state.ctrlBank = clamp(bank, -1, 1);
      state.ctrlPitch = clamp(pitch, -1, 1);
    },
    clearStick() { state.touching = false; state.ctrlBank = 0; state.ctrlPitch = 0; },
    placeOnRunway() { repositionToStart(); },
    setVehicle(key) { applyVehicle(key); },
    skipScreens() {
      el.screenVehicle.classList.add("hiddenS");
      el.screenDir.classList.add("hiddenS");
    },
    teleportAirborne(distBehind, lateral, alt, headingDeg) {
      state.x = lateral;
      state.z = TUNE.runwayLength / 2 + distBehind;
      state.y = RWY_ELEV + alt;
      state.heading = headingDeg * DEG;
      state.pitch = 0;
      state.bank = 0;
      state.speed = state.vp.cruiseSpeed;
      state.airVy = null;
      state.phase = "AIRBORNE";
      state.liftoffTimer = 0;
      state.climbAwayTimer = 0;
      state.celebrated = false;
      state.celebrateTimer = 0;
      state.approachLatch = false;
      state.canRotate = false;
    }
  }
};

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt <= 0) dt = 1 / 120;
  update(dt);
  if (!(window.__lp && window.__lp.noRender)) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
