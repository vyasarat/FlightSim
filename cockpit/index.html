<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#79c8f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Little Pilot</title>
<style>
  :root { --veh: #e0483e; --veh2: #f2f4f7; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79c8f2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas#gl {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .pillar {
    position: absolute;
    top: -4vh;
    width: clamp(34px, 7vw, 92px);
    height: 62vh;
    background: linear-gradient(105deg, #2b3038 0%, #23282f 55%, #1a1e24 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.45);
  }
  #pillarL {
    left: calc(-2vw + env(safe-area-inset-left));
    transform: skewX(7deg);
    border-radius: 0 14px 26px 0;
  }
  #pillarR {
    right: calc(-2vw + env(safe-area-inset-right));
    transform: skewX(-7deg);
    border-radius: 0 0 14px 26px;
    transform: skewX(-7deg);
  }
  #brow {
    position: absolute;
    top: calc(-2vh + env(safe-area-inset-top));
    left: -2vw;
    right: -2vw;
    height: clamp(30px, 6.5vh, 74px);
    background: linear-gradient(180deg, #2b3038 0%, #23282f 70%, #1a1e24 100%);
    border-radius: 0 0 22px 22px;
    box-shadow: 0 6px 16px rgba(10,20,40,.35);
  }
  #accentLine {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 0 0 22px 22px;
  }
  #dash {
    position: absolute;
    left: -2vw;
    right: -2vw;
    bottom: calc(-2vh + env(safe-area-inset-bottom));
    height: clamp(96px, 19vh, 170px);
    background: linear-gradient(180deg, #333a44 0%, #23282f 18%, #1a1e24 100%);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 24px rgba(10,20,40,.35);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(18px, 5vw, 64px);
    padding-top: clamp(10px, 2.2vh, 24px);
  }
  #dash::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 26px 26px 0 0;
  }
  .dial {
    position: relative;
    width: clamp(76px, 15vmin, 128px);
    height: clamp(76px, 15vmin, 128px);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #2c323b 0%, #161a1f 62%);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.08);
    border: clamp(3px, 0.8vmin, 6px) solid #39404b;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(2.5px, 0.7vmin, 4.5px);
    height: 42%;
    background: #f2f4f7;
    border-radius: 3px;
    transform-origin: 50% 100%;
    translate: -50% -100%;
    will-change: transform;
  }
  .needle.red { background: #e0483e; height: 36%; width: clamp(3.5px, 1vmin, 6px); }
  .dial-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16%;
    height: 16%;
    background: #39404b;
    border-radius: 50%;
    translate: -50% -50%;
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(1.5px, 0.4vmin, 3px);
    height: 11%;
    background: #8b93a0;
    transform-origin: 50% 0;
  }
  #aiBall {
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(180deg, #79c8f2 0%, #a8dcf7 46%, #f4f8fa 48%, #f4f8fa 50%, #8a6f47 52%, #6f5738 100%);
    will-change: transform;
  }
  #aiHorizon {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: clamp(2px, 0.55vmin, 4px);
    background: #ffffff;
    opacity: .9;
  }
  #aiWings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58%;
    height: clamp(4px, 1.1vmin, 8px);
    translate: -50% -50%;
    z-index: 3;
  }
  #aiWings::before, #aiWings::after {
    content: "";
    position: absolute;
    top: 0;
    width: 44%;
    height: clamp(3px, 0.8vmin, 5px);
    background: #ffb43a;
    border-radius: 3px;
  }
  #aiWings::before { left: 0; }
  #aiWings::after { right: 0; }
  #aiWings span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(6px, 1.6vmin, 10px);
    height: clamp(6px, 1.6vmin, 10px);
    translate: -50% -50%;
    background: #ffb43a;
    border-radius: 50%;
  }
  #altDigits {
    position: absolute;
    left: 50%;
    bottom: 9%;
    translate: -50% 0;
    color: #e8ecf2;
    font-size: clamp(13px, 3.4vmin, 24px);
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  #rotateArrow {
    position: fixed;
    top: max(11vh, env(safe-area-inset-top) + 44px);
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #rotateArrow svg { width: clamp(72px, 14vmin, 130px); height: auto; display: block; }
  @keyframes blinkArrow {
    0%, 49% { opacity: 1; transform: translateY(0); }
    50%, 100% { opacity: 0.12; transform: translateY(10px); }
  }
  #rotateArrow.on { display: block; animation: blinkArrow .55s infinite; }
  #homeArrow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 7;
    pointer-events: none;
  }
  #homeArrow svg {
    display: none;
    width: var(--home-sz, 96px);
    height: var(--home-sz, 96px);
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.5));
  }
  #homeArrow.on svg {
    display: block;
    animation: homePulse 1.5s ease-in-out infinite;
  }
  @keyframes homePulse {
    0%, 100% { opacity: .82; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  #throttleBtn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    width: clamp(96px, 17vmin, 148px);
    height: clamp(96px, 17vmin, 148px);
    border-radius: 50%;
    border: clamp(4px, 1vmin, 7px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 10px 26px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    z-index: 10;
    touch-action: none;
    padding: 0;
    outline: none;
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #throttleBtn svg { width: 52%; height: 52%; }
  #throttleBtn.pressed {
    transform: scale(.93);
    box-shadow: 0 4px 12px rgba(10,20,40,.4), inset 0 3px 10px rgba(0,0,0,.5);
  }
  #throttleBtn.hidden { display: none; }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }
  html { --btn: clamp(92px, 15vmin, 128px); }
  .roundBtn {
    position: fixed;
    width: var(--btn);
    height: var(--btn);
    border-radius: 50%;
    border: clamp(3px, 0.8vmin, 6px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 8px 20px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    touch-action: none;
    padding: 0;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .08s ease, opacity .25s ease, visibility .25s;
  }
  .roundBtn svg { width: 54%; height: 54%; pointer-events: none; }
  .roundBtn:active { transform: scale(.93); }
  .roundBtn.off { opacity: .55; }
  #viewBtn {
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 46px);
    right: calc(22px + env(safe-area-inset-right));
    z-index: 11;
  }
  #gearBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    left: calc(22px + env(safe-area-inset-left));
    z-index: 10;
  }
  #gearBtn.hidden { display: none; }
  #skipBtn {
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 46px);
    left: calc(22px + env(safe-area-inset-left));
    z-index: 11;
  }
  #skipBtn.hidden { display: none; }
  #vehBtn {
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 46px);
    left: calc(22px + env(safe-area-inset-left));
    z-index: 11;
  }
  #vehBtn.hidden { display: none; }
  /* imminent-crash alarm: red edge strobes + flashing warning triangle */
  #alarm { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #alarm.on { display: block; }
  #alarm .vig {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 clamp(60px, 14vmin, 160px) clamp(20px, 5vmin, 60px) rgba(224, 40, 40, .85);
    animation: alarmStrobe .3s steps(2, jump-none) infinite;
  }
  #alarm .tri {
    position: absolute; left: 50%; top: 14%;
    width: clamp(70px, 14vmin, 130px); height: clamp(70px, 14vmin, 130px);
    translate: -50% 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
    animation: alarmStrobe .3s steps(2, jump-none) infinite;
  }
  @keyframes alarmStrobe { 0% { opacity: 1; } 100% { opacity: .1; } }
  @media (prefers-reduced-motion: reduce) { #alarm .vig, #alarm .tri { animation: none; } }
  /* wingman icon: dim while a traffic plane is near, bright when formation is held */
  #wingman {
    position: fixed; top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 50px);
    left: 50%; translate: -50% 0;
    width: clamp(48px, 9vmin, 84px); height: clamp(48px, 9vmin, 84px);
    z-index: 7; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #wingman.near { opacity: .55; }
  #wingman.done { opacity: 1; animation: homePulse .6s ease-in-out 3; }
  #gearBtn .icoUp { display: none; }
  #gearBtn.gear-up .icoDown { display: none; }
  #gearBtn.gear-up .icoUp { display: block; }
  #hud.chase #pillarL, #hud.chase #pillarR, #hud.chase #brow { display: none; }
  #glideGuide {
    position: fixed;
    top: 30%;
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #aimMarker {
    position: fixed;
    width: 0; height: 0;
    z-index: 6;
    pointer-events: none;
    display: none;
  }
  #aimMarker.on { display: block; }
  #aimMarker svg {
    width: clamp(24px, 4.2vmin, 38px);
    height: clamp(24px, 4.2vmin, 38px);
    translate: -50% -50%;
    display: block;
    opacity: 0.85;
    filter: drop-shadow(0 2px 6px rgba(10,30,60,.4));
  }
  #glideGuide.on { display: block; }
  #glideGuide svg { width: clamp(64px, 12vmin, 108px); height: auto; display: none; }
  #glideGuide[data-state="up"] .gUp { display: block; }
  #glideGuide[data-state="down"] .gDown { display: block; }
  #glideGuide[data-state="ok"] .gOk { display: block; animation: guidePulse 0.9s ease-in-out infinite; }
  @keyframes guidePulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.12); }
  }
  #slowBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + env(safe-area-inset-bottom));
    right: calc(22px + env(safe-area-inset-right));
    z-index: 10;
  }
  #slowBtn.hidden { display: none; }
  #slowBtn.pressed { transform: scale(.93); }
  #fastBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + var(--btn) + 14px + env(safe-area-inset-bottom));
    right: calc(22px + env(safe-area-inset-right));
    z-index: 10;
  }
  #fastBtn.hidden { display: none; }
  #fastBtn.pressed { transform: scale(.93); }
  #missileBtn {
    bottom: calc(clamp(110px, 21vh, 190px) + var(--btn) + 14px + env(safe-area-inset-left));
    left: calc(22px + env(safe-area-inset-left));
    z-index: 10;
  }
  #missileBtn.hidden { display: none; }
  #missileBtn.pressed { transform: scale(.93); }
  #missileBtn.cooldown { opacity: .45; }
  .screen {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 30%, rgba(36,44,56,.97), rgba(14,17,22,.98));
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: clamp(16px, 3vmin, 34px);
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-y: auto;
  }
  .screen.hiddenS, .card.hiddenS { display: none; }
  .card {
    width: clamp(150px, 23vmin, 225px);
    height: clamp(110px, 16vmin, 158px);
    border-radius: 22px;
    background: linear-gradient(165deg, #2e3540 0%, #191d23 100%);
    border: clamp(4px, 0.9vmin, 7px) solid #39404b;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none; touch-action: manipulation;
    transition: transform .08s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .card:active { transform: scale(.94); }
  .card.sel { border-color: var(--veh); }
  .card svg { width: 84%; height: 84%; }
  .dirCard {
    width: clamp(180px, 30vmin, 270px);
    height: clamp(140px, 23vmin, 215px);
  }
  #progressStrip {
    position: fixed;
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 12px);
    left: 50%;
    translate: -50% 0;
    width: min(46vw, 430px);
    height: 26px;
    z-index: 6;
    pointer-events: none;
  }
  #progressStrip .rail {
    position: absolute;
    top: 12px; left: 0; right: 0;
    height: 3.5px;
    background: rgba(20,26,34,.6);
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  #progressStrip .dot {
    position: absolute;
    top: 9.5px;
    width: 9px; height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: #39404b;
    border: 2px solid rgba(240,244,248,.8);
    transition: background .3s;
  }
  #progressStrip .dot.passed { background: var(--veh); }
  #progressStrip .marker {
    position: absolute;
    top: -3px;
    width: 22px; height: 22px;
    margin-left: -11px;
    will-change: transform;
  }
</style>
</head>
<body>
<div id="hud">
  <div id="pillarL" class="pillar"></div>
  <div id="pillarR" class="pillar"></div>
  <div id="brow"><div id="accentLine"></div></div>
  <div id="dash">
    <div class="dial" id="asiDial"></div>
    <div class="dial" id="aiDial">
      <div id="aiBall"><div id="aiHorizon"></div></div>
      <div id="aiWings"><span></span></div>
    </div>
    <div class="dial" id="altDial"><div id="altDigits">0</div></div>
  </div>
</div>
<div id="rotateArrow">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 8 L88 66 L66 66 L66 94 L34 94 L34 66 L12 66 Z" fill="#ffd23e" stroke="#c9971d" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</div>
<button id="skipBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path d="M38 6 L62 6 L67 94 L33 94 Z" fill="none" stroke="#f2f4f7" stroke-width="6" stroke-linejoin="round"/>
    <line x1="50" y1="16" x2="50" y2="84" stroke="#e0483e" stroke-width="5" stroke-dasharray="9 9"/>
  </svg>
</button>
<button id="viewBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path d="M50 22 a28 28 0 1 0 28 28" fill="none" stroke="#f2f4f7" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 34 L82 52 L64 46 Z" fill="#f2f4f7" stroke="#f2f4f7" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</button>
<button id="fastBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 46 L50 22 L72 46" fill="none" stroke="#f2f4f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 76 L50 52 L72 76" fill="none" stroke="#f2f4f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<button id="missileBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 6 Q60 20 60 40 L60 66 L40 66 L40 40 Q40 20 50 6 Z" fill="#f2f4f7" stroke="#23282f" stroke-width="3"/>
    <path d="M40 52 L28 70 L40 66 Z" fill="#e0483e"/>
    <path d="M60 52 L72 70 L60 66 Z" fill="#e0483e"/>
    <path d="M44 66 Q50 84 56 66 Z" fill="#ffb43a"/>
  </svg>
</button>
<button id="slowBtn" class="roundBtn" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path d="M28 44 L50 70 L72 44" fill="none" stroke="#f2f4f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 72 L50 94 L72 72" fill="none" stroke="#e0483e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
  </svg>
</button>
<button id="gearBtn" class="roundBtn" aria-hidden="true">
  <svg class="icoDown" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="34" stroke="#f2f4f7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="56" r="18" fill="#f2f4f7"/>
    <line x1="16" y1="90" x2="84" y2="90" stroke="#f2f4f7" stroke-width="8" stroke-linecap="round"/>
  </svg>
  <svg class="icoUp" viewBox="0 0 100 100">
    <line x1="50" y1="8" x2="50" y2="34" stroke="#8b93a0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="56" r="18" fill="none" stroke="#8b93a0" stroke-width="9"/>
    <line x1="18" y1="20" x2="82" y2="86" stroke="#e0483e" stroke-width="11" stroke-linecap="round"/>
  </svg>
</button>
<div id="aimMarker">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="30" fill="none" stroke="#f2f4f7" stroke-width="5" opacity="0.9"/>
    <circle cx="50" cy="50" r="6" fill="#f2f4f7"/>
    <line x1="50" y1="4" x2="50" y2="26" stroke="#f2f4f7" stroke-width="5"/>
    <line x1="50" y1="74" x2="50" y2="96" stroke="#f2f4f7" stroke-width="5"/>
    <line x1="4" y1="50" x2="26" y2="50" stroke="#f2f4f7" stroke-width="5"/>
    <line x1="74" y1="50" x2="96" y2="50" stroke="#f2f4f7" stroke-width="5"/>
  </svg>
</div>
<div id="glideGuide">
  <svg class="gUp" viewBox="0 0 100 100">
    <path d="M50 14 L86 74 L62 62 L62 90 L38 90 L38 62 L14 74 Z" fill="#ffd23e" stroke="#8a6a10" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <svg class="gDown" viewBox="0 0 100 100">
    <path d="M50 90 L14 30 L38 42 L38 14 L62 14 L62 42 L86 30 Z" fill="#ffd23e" stroke="#8a6a10" stroke-width="5" stroke-linejoin="round"/>
  </svg>
  <svg class="gOk" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#3fdc6a" stroke-width="10"/>
    <circle cx="50" cy="50" r="14" fill="#3fdc6a"/>
  </svg>
</div>
<div id="progressStrip"><div class="rail"></div></div>
<div id="homeArrow">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 6 L90 74 L64 62 L58 93 L42 93 L36 62 L10 74 Z" fill="#f2f4f7" stroke="#23282f" stroke-width="7" stroke-linejoin="round"/>
  </svg>
