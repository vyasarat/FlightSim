<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#79c8f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Little Pilot</title>
<style>
  :root { --veh: #e0483e; --veh2: #f2f4f7; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79c8f2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas#gl {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .pillar {
    position: absolute;
    top: -4vh;
    width: clamp(34px, 7vw, 92px);
    height: 62vh;
    background: linear-gradient(105deg, #2b3038 0%, #23282f 55%, #1a1e24 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.45);
  }
  #pillarL {
    left: calc(-2vw + env(safe-area-inset-left));
    transform: skewX(7deg);
    border-radius: 0 14px 26px 0;
  }
  #pillarR {
    right: calc(-2vw + env(safe-area-inset-right));
    transform: skewX(-7deg);
    border-radius: 0 0 14px 26px;
    
  }
  #brow {
    position: absolute;
    top: calc(-2vh + env(safe-area-inset-top));
    left: -2vw;
    right: -2vw;
    height: var(--brow-h);
    background: linear-gradient(180deg, #2b3038 0%, #23282f 70%, #1a1e24 100%);
    border-radius: 0 0 22px 22px;
    box-shadow: 0 6px 16px rgba(10,20,40,.35);
  }
  #accentLine {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 0 0 22px 22px;
  }
  #dash {
    position: absolute;
    left: -2vw;
    right: -2vw;
    bottom: calc(-2vh + env(safe-area-inset-bottom));
    height: var(--dash-h);
    background: linear-gradient(180deg, #333a44 0%, #23282f 18%, #1a1e24 100%);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 24px rgba(10,20,40,.35);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(18px, 5vw, 64px);
    padding-top: clamp(10px, 2.2vh, 24px);
  }
  #dash::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(4px, 0.9vh, 9px);
    background: var(--veh);
    border-radius: 26px 26px 0 0;
  }
  .dial {
    position: relative;
    width: var(--dial);
    height: var(--dial);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #2c323b 0%, #161a1f 62%);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.08);
    border: clamp(3px, 0.8vmin, 6px) solid #39404b;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(2.5px, 0.7vmin, 4.5px);
    height: 42%;
    background: #f2f4f7;
    border-radius: 3px;
    transform-origin: 50% 100%;
    translate: -50% -100%;
    will-change: transform;
  }
  .needle.red { background: #e0483e; height: 36%; width: clamp(3.5px, 1vmin, 6px); }
  .dial-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16%;
    height: 16%;
    background: #39404b;
    border-radius: 50%;
    translate: -50% -50%;
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(1.5px, 0.4vmin, 3px);
    height: 11%;
    background: #8b93a0;
    transform-origin: 50% 0;
  }
  #aiBall {
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(180deg, #79c8f2 0%, #a8dcf7 46%, #f4f8fa 48%, #f4f8fa 50%, #8a6f47 52%, #6f5738 100%);
    will-change: transform;
  }
  #aiHorizon {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: clamp(2px, 0.55vmin, 4px);
    background: #ffffff;
    opacity: .9;
  }
  #aiWings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58%;
    height: clamp(4px, 1.1vmin, 8px);
    translate: -50% -50%;
    z-index: 3;
  }
  #aiWings::before, #aiWings::after {
    content: "";
    position: absolute;
    top: 0;
    width: 44%;
    height: clamp(3px, 0.8vmin, 5px);
    background: #ffb43a;
    border-radius: 3px;
  }
  #aiWings::before { left: 0; }
  #aiWings::after { right: 0; }
  #aiWings span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(6px, 1.6vmin, 10px);
    height: clamp(6px, 1.6vmin, 10px);
    translate: -50% -50%;
    background: #ffb43a;
    border-radius: 50%;
  }
  #altDigits {
    position: absolute;
    left: 50%;
    bottom: 9%;
    translate: -50% 0;
    color: #e8ecf2;
    font-size: clamp(13px, 3.4vmin, 24px);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }  #altDigits[data-len="4"] { font-size: clamp(11px, 2.9vmin, 20px); }
  #altDigits[data-len="5"] { font-size: clamp(10px, 2.4vmin, 17px); }

  #rotateArrow {
    position: fixed;
    top: max(11vh, env(safe-area-inset-top) + 44px);
    left: 50%;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #rotateArrow svg { width: clamp(72px, 14vmin, 130px); height: auto; display: block; }
  @keyframes blinkArrow {
    0%, 49% { opacity: 1; transform: translateY(0); }
    50%, 100% { opacity: 0.12; transform: translateY(10px); }
  }
  #rotateArrow.on { display: block; animation: blinkArrow .55s infinite; }
  #homeArrow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 7;
    pointer-events: none;
  }
  #homeArrow svg {
    display: none;
    width: var(--home-sz, 96px);
    height: var(--home-sz, 96px);
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.5));
  }
  #homeArrow.on svg {
    display: block;
    opacity: .75;
    animation: homePulse 1.5s ease-in-out infinite;
  }
  @keyframes homePulse {
    0%, 100% { opacity: .7; transform: scale(1); }
    50% { opacity: .9; transform: scale(1.05); }
  }
  #heliUpBtn.hidden, #heliDownBtn.hidden, #heliHoverBtn.hidden { display: none; }
  #heliUpBtn, #heliDownBtn, #heliHoverBtn { z-index: 10; color: #f2f4f7; }
  #heliUpBtn, #heliDownBtn { right: calc(var(--edge) + env(safe-area-inset-right)); width: var(--thr); height: var(--thr); border-color: #5ff1ff; background: rgba(12, 43, 59, .9); }
  #heliDownBtn { bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom)); }
  #heliUpBtn { bottom: calc(var(--stack-bottom) + var(--thr) + 12px + env(safe-area-inset-bottom)); }
  #heliHoverBtn { right: calc(var(--edge) + var(--thr) + 12px + env(safe-area-inset-right)); bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom)); }
  #heliUpBtn.pressed, #heliDownBtn.pressed, #heliHoverBtn.holding { background: #247b83; box-shadow: 0 0 18px #5ff1ff88; }
  #heliTarget { position: fixed; width: 38px; height: 38px; transform: translate(-50%, -50%); pointer-events: none; z-index: 7; color: #5ff1ff; filter: drop-shadow(0 2px 3px #10202b); }
  #heliTarget .bearing { display: none; transform-origin: 24px 24px; transform: rotate(var(--bearing)); }
  #heliTarget.offscreen .bearing { display: block; }
  #heliTarget.offscreen .destination { display: none; }
  #heliTarget.hidden { display: none; }
  #throttleBtn {
    position: fixed;
    right: calc(var(--edge) + 4px + env(safe-area-inset-right));
    bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom));
    width: var(--thr);
    height: var(--thr);
    border-radius: 50%;
    border: clamp(4px, 1vmin, 7px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 10px 26px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    z-index: 10;
    touch-action: none;
    padding: 0;
    outline: none;
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #throttleBtn svg { width: 52%; height: 52%; }
  #throttleBtn.pressed {
    transform: scale(.93);
    box-shadow: 0 4px 12px rgba(10,20,40,.4), inset 0 3px 10px rgba(0,0,0,.5);
  }
  #throttleBtn.hidden { display: none; }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }
  /* Layout tokens. The phone tier (short landscape viewports) shrinks every
     control and the dash so nothing overlaps; iPad sizes are unchanged. */
  html {
    --btn: clamp(92px, 15vmin, 128px);
    --thr: clamp(96px, 17vmin, 148px);
    --stack-bottom: clamp(110px, 21vh, 190px);   /* base of the bottom button stack (above the dash) */
    --top-row: calc(clamp(30px, 6.5vh, 74px) + 46px);
    --edge: 22px;
    --dash-h: clamp(96px, 19vh, 170px);
    --brow-h: clamp(30px, 6.5vh, 74px);
    --dial: clamp(76px, 15vmin, 128px);
  }
  @media (max-height: 360px) {
    html { --btn: 48px; --thr: 54px; --stack-bottom: 58px; --top-row: 14px; --edge: 10px; }
  }
  @media (max-height: 520px) {
    html {
      --btn: clamp(58px, 15vmin, 70px);
      --thr: clamp(64px, 17vmin, 78px);
      --stack-bottom: 74px;
      --top-row: 24px;
      --edge: 12px;
      --dash-h: 66px;
      --brow-h: 20px;
      --dial: 54px;
    }
    #homeArrow svg { width: 28px; height: 28px; }
    #rotateArrow svg { width: 56px; }
    #glideGuide svg { width: 32px; }
    #glideGuide { top: calc(var(--brow-h) + env(safe-area-inset-top) + 30px); }
    #altDigits { font-size: 12px; }
    #progressStrip { width: min(34vw, 300px); top: calc(var(--brow-h) + env(safe-area-inset-top) + 4px); }
    #wingman { width: 34px; height: 34px; }
    #photo .frame { padding: 8px 8px 26px; }
    #photo img { width: min(60vw, 420px); }
    #alarm .tri { width: 60px; height: 60px; }
  }
  .roundBtn {
    position: fixed;
    width: var(--btn);
    height: var(--btn);
    border-radius: 50%;
    border: clamp(3px, 0.8vmin, 6px) solid var(--veh);
    background: radial-gradient(circle at 36% 30%, #3a414c 0%, #23282f 58%, #161a1f 100%);
    box-shadow: 0 8px 20px rgba(10,20,40,.45), inset 0 3px 6px rgba(255,255,255,.1);
    touch-action: none;
    padding: 0;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .08s ease, opacity .25s ease, visibility .25s;
  }
  .roundBtn svg { width: 54%; height: 54%; pointer-events: none; }
  .roundBtn:active, .roundBtn.pressed { transform: scale(.93); }
  .roundBtn.off { opacity: .55; }
  #viewBtn {
    top: calc(var(--top-row) + env(safe-area-inset-top));
    right: calc(var(--edge) + env(safe-area-inset-right));
    z-index: 11;
  }
  #gearBtn {
    bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
  }
  #gearBtn.hidden { display: none; }
  #skipBtn {
    top: calc(var(--top-row) + env(safe-area-inset-top));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 11;
  }
  #skipBtn.hidden { display: none; }
  #skipBtn .tgt { display: none; }
  #skipBtn[data-target="home"] .home, #skipBtn[data-target="moon"] .moon, #skipBtn[data-target="mars"] .mars, #skipBtn[data-target="station"] .station, #skipBtn[data-target="capsule"] .capsule { display: block; }
  #skipBtn[data-target="moon"], #skipBtn[data-target="mars"], #skipBtn[data-target="station"] { border-color: #5ff1ff; animation: homePulse 1.4s ease-in-out infinite; }
  #vehBtn {
    top: calc(var(--top-row) + env(safe-area-inset-top));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 11;
  }
  #vehBtn.hidden { display: none; }
  #stageBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
    border-color: #ffb43a;
    animation: homePulse 1.2s ease-in-out infinite;
  }
  #stageBtn.hidden { display: none; }
  #roverBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10; border-color: #ffd23e;
  }
  #roverBtn.hidden { display: none; }
  #hatchBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10; border-color: #5ff1ff;
  }
  #hatchBtn.hidden { display: none; }
  #hatchBtn[data-mode="in"] { animation: homePulse 1.2s ease-in-out infinite; }
  #hatchBtn .back, #hatchBtn .eva { display: none; }
  #hatchBtn[data-mode="back"] .back, #hatchBtn[data-mode="eva"] .eva { display: block; }
  #hatchBtn[data-mode="back"] .in, #hatchBtn[data-mode="eva"] .in { display: none; }
  #hatchBtn[data-mode="eva"] { border-color: #ffd23e; }
  #roverBtn .back { display: none; }
  #roverBtn[data-mode="back"] .back { display: block; }
  #roverBtn[data-mode="back"] .out { display: none; }
  #satBtn, #chuteBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
  }
  #chuteBtn { animation: homePulse 1.2s ease-in-out infinite; }
  #roverBtn[data-mode="out"] { animation: homePulse 1.2s ease-in-out infinite; }
  #satBtn { border-color: #5ff1ff; }
  #chuteBtn { border-color: #e0483e; }
  #satBtn.hidden, #chuteBtn.hidden { display: none; }
  #reentryGlow {
    position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(255,120,30,0) 30%, rgba(255,140,40,.55) 70%, rgba(255,210,120,.95) 100%);
    mix-blend-mode: screen;
    transition: opacity .12s linear;
  }
  #camBtn {
    top: calc(var(--top-row) + var(--btn) + 12px + env(safe-area-inset-top));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 11;
  }
  /* photo moment: white flash, then the shot in a polaroid frame for a few seconds */
  #flash { position: fixed; inset: 0; z-index: 40; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; }
  #flash.on { opacity: .9; transition: none; }
  #photo { position: fixed; inset: 0; z-index: 39; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #photo.on { display: flex; }
  #photo .frame {
    background: #f6f3ea; padding: 14px 14px 46px; border-radius: 6px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5); transform: rotate(-3deg);
    animation: photoIn .5s cubic-bezier(.2,1.4,.4,1);
    pointer-events: none;   /* the stick must keep working underneath */
  }
  #photo img { display: block; width: min(62vw, 720px); height: auto; border-radius: 2px; user-select: none; }
  @keyframes photoIn { 0% { transform: scale(.3) rotate(12deg); opacity: 0; } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #photo .frame { animation: none; } }
  /* imminent-crash alarm: red edge strobes + flashing warning triangle */
  #alarm { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #alarm.on { display: block; }
  #alarm .vig {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 clamp(60px, 14vmin, 160px) clamp(20px, 5vmin, 60px) rgba(224, 40, 40, .85);
    animation: alarmStrobe .3s steps(2, jump-none) infinite;
  }
  #alarm .tri {
    position: absolute; left: 50%; top: 24%;
    width: clamp(70px, 14vmin, 130px); height: clamp(70px, 14vmin, 130px);
    translate: -50% 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
    animation: alarmStrobe .3s steps(2, jump-none) infinite;
  }
  @keyframes alarmStrobe { 0% { opacity: 1; } 100% { opacity: .1; } }
  @media (prefers-reduced-motion: reduce) { #alarm .vig, #alarm .tri { animation: none; } }
  /* wingman icon: dim while a traffic plane is near, bright when formation is held */
  #wingman {
    position: fixed; top: calc(var(--brow-h) + env(safe-area-inset-top) + 44px);
    left: calc(50% + 90px); translate: -50% 0;   /* beside the glide arrow's slot, not on it */
    width: clamp(48px, 9vmin, 84px); height: clamp(48px, 9vmin, 84px);
    z-index: 7; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #wingman.near { opacity: .55; }
  #wingman.done { opacity: 1; animation: homePulse .6s ease-in-out 3; }
  #gearBtn .icoUp { display: none; }
  #gearBtn.gear-up .icoDown { display: none; }
  #gearBtn.gear-up .icoUp { display: block; }
  #hud.chase #pillarL, #hud.chase #pillarR, #hud.chase #brow { display: none; }
  #glideGuide {
    position: fixed;
    /* small and high, just under the route strip: a cue, not an obstacle */
    top: calc(var(--brow-h) + env(safe-area-inset-top) + 44px);
    left: 50%;
    opacity: .85;
    translate: -50% 0;
    z-index: 8;
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(10,30,60,.45));
  }
  #aimMarker {
    position: fixed;
    width: 0; height: 0;
    z-index: 6;
    pointer-events: none;
    display: none;
  }
  #aimMarker.on { display: block; }
  #aimMarker svg {
    width: clamp(24px, 4.2vmin, 38px);
    height: clamp(24px, 4.2vmin, 38px);
    translate: -50% -50%;
    display: block;
    opacity: 0.85;
    filter: drop-shadow(0 2px 6px rgba(10,30,60,.4));
  }
  #glideGuide.on { display: block; }
  #glideGuide svg { width: clamp(36px, 6.5vmin, 56px); height: auto; display: none; }
  #glideGuide[data-state="up"] .gUp { display: block; }
  #glideGuide[data-state="down"] .gDown { display: block; }
  #glideGuide[data-state="ok"] .gOk { display: block; animation: guidePulse 0.9s ease-in-out infinite; }
  @keyframes guidePulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.12); }
  }
  #slowBtn {
    bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom));
    right: calc(var(--edge) + env(safe-area-inset-right));
    z-index: 10;
  }
  #slowBtn.hidden { display: none; }
  #slowBtn.pressed { transform: scale(.93); }
  #fastBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    right: calc(var(--edge) + env(safe-area-inset-right));
    z-index: 10;
  }
  #fastBtn.hidden { display: none; }
  #fastBtn.pressed { transform: scale(.93); }
  #missileBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
  }
  /* on a rocket it drops to the gear row, which is empty there: the shared slot
     above already holds stage / satellite / parachute / rover / hatch */
  #missileBtn.lowSlot { bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom)); }
  /* the Mars drone: the rocket has no gear, so that row is free for it */
  #droneBtn {
    bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
    border-color: #d4a72c;
    animation: homePulse 1.2s ease-in-out infinite;
  }
  #droneBtn.hidden { display: none; }
  #droneBtn .fly, #droneBtn .back { display: none; }
  #droneBtn[data-mode="fly"] .fly, #droneBtn[data-mode="back"] .back { display: block; }
  /* the catapult: planes have gear, so this one lives in the shared slot above it */
  #catBtn {
    bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
    border-color: #5ff1ff;
    animation: homePulse 1.1s ease-in-out infinite;
  }
  #catBtn.hidden { display: none; }
  /* the water bucket: the helicopter has no gear, so that row is free for it */
  #magnetBtn, #washBtn { left: calc(var(--edge) + env(safe-area-inset-left)); z-index: 10; border-color: #ffd23e; }
  #magnetBtn { bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom)); }
  #washBtn { bottom: calc(var(--stack-bottom) + var(--btn) + 12px + env(safe-area-inset-bottom)); border-color: #5ff1ff; }
  #magnetBtn.hidden, #washBtn.hidden { display: none; }
  #bucketBtn {
    bottom: calc(var(--stack-bottom) + env(safe-area-inset-bottom));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 10;
    border-color: #5ff1ff;
    animation: homePulse 1.2s ease-in-out infinite;
  }
  #bucketBtn.hidden { display: none; }
  #bucketBtn .scoop, #bucketBtn .drop { display: none; }
  #bucketBtn[data-mode="scoop"] .scoop, #bucketBtn[data-mode="drop"] .drop { display: block; }
  #missileBtn.hidden { display: none; }
  #missileBtn.pressed { transform: scale(.93); }
  #missileBtn.cooldown { opacity: .45; }
  /* the big numeral: every set-piece counts down before it bangs. Numbers are
     allowed in this game, words are not. Nothing is on screen unless a wind-up
     is actually running, so the HUD gains nothing permanent. */
  #bigNum {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
    z-index: 25; pointer-events: none;
    font: 700 clamp(90px, 22vh, 220px)/1 system-ui, -apple-system, sans-serif;
    color: #fff4d6; text-shadow: 0 0 24px rgba(255,180,58,.9), 0 6px 18px rgba(0,0,0,.55);
    opacity: 0; transition: opacity .18s ease-out;
  }
  #bigNum.on { opacity: .96; }
  #bigNum.beat { animation: numBeat .5s ease-out; }
  @keyframes numBeat { from { transform: translate(-50%,-50%) scale(1.5); } to { transform: translate(-50%,-50%) scale(1); } }
  .screen {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 30%, rgba(36,44,56,.97), rgba(14,17,22,.98));
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: clamp(16px, 3vmin, 34px);
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-y: auto;
    touch-action: pan-y;
  }
  .screen.hiddenS, .card.hiddenS { display: none; }
  .card {
    width: clamp(150px, 23vmin, 225px);
    height: clamp(110px, 16vmin, 158px);
    border-radius: 22px;
    background: linear-gradient(165deg, #2e3540 0%, #191d23 100%);
    border: clamp(4px, 0.9vmin, 7px) solid #39404b;
    display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none; touch-action: manipulation;
    transition: transform .08s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .card:active { transform: scale(.94); }
  .card.sel { border-color: var(--veh); }
  .card svg { width: 84%; height: 84%; }
  .dirCard {
    width: clamp(180px, 30vmin, 270px);
    height: clamp(140px, 23vmin, 215px);
  }
  .destCard { width: clamp(150px, 24vmin, 220px); height: clamp(150px, 24vmin, 220px); }
  #photo.patch .frame { border-radius: 50%; padding: 16px; background: #1b2a44; border: 6px solid #d4a72c; transform: rotate(0deg); }
  #photo.patch img { border-radius: 50%; width: min(52vw, 560px); aspect-ratio: 1 / 1; object-fit: cover; }
  #progressStrip {
    position: fixed;
    top: calc(clamp(30px, 6.5vh, 74px) + env(safe-area-inset-top) + 12px);
    left: 50%;
    translate: -50% 0;
    width: min(46vw, 430px);
    height: 26px;
    z-index: 6;
    pointer-events: none;
  }
  #progressStrip .rail {
    position: absolute;
    top: 12px; left: 0; right: 0;
    height: 3.5px;
    background: rgba(20,26,34,.6);
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  #progressStrip .dot {
    position: absolute;
    top: 9.5px;
    width: 9px; height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: #39404b;
    border: 2px solid rgba(240,244,248,.8);
    transition: background .3s;
  }
  #progressStrip .dot.passed { background: var(--veh); }
  #progressStrip .marker {
    position: absolute;
    top: -3px;
    width: 22px; height: 22px;
    margin-left: -11px;
    will-change: transform;
  }
</style>
</head>
