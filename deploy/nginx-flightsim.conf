# Reference copy of /etc/nginx/sites-available/flightsim on the droplet.
#
# nginx `add_header` is NOT inherited into a location block that sets its own
# add_header, so the security headers are repeated in every location via the
# snippet below rather than declared once at server level.
#
# The snippet is versioned next to this file: copy deploy/flightsim-headers.conf
# to /etc/nginx/snippets/flightsim-headers.conf (nginx -t fails without it).

server {
    server_name flightsim.138.197.80.104.nip.io;

    root /var/www/flightsim;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Both service workers (root and /cockpit/): never HTTP-cached so a new
    # CACHE_NAME is seen on the next launch.
    location ~ ^(/cockpit)?/sw\.js$ {
        include snippets/flightsim-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vendored three.js only changes with a CACHE_NAME bump; long-cache it.
    location ~ ^/cockpit/three\.min\.js$ {
        include snippets/flightsim-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(png|ico|woff2?)$ {
        include snippets/flightsim-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        include snippets/flightsim-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/flightsim.138.197.80.104.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/flightsim.138.197.80.104.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = flightsim.138.197.80.104.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name flightsim.138.197.80.104.nip.io;
    return 404; # managed by Certbot


}
